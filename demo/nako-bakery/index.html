<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nako.bakery Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: flaky layers — stacked wavy pastry bands in apple, cinnamon and cream; soft and homely. */
 --bg:#fff9f1; --ink:#3b2516; --muted:#7a5e48; --accent:#b9532b; --on-accent:#fff; --line:#f0e0cc; --card:#fff; --card-ink:#3b2516;
 --radius:20px; --chip-radius:999px; --btn-radius:999px;
 --display:"DM Serif Display","Noto Sans Georgian",serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Sans Georgian",sans-serif; }
header.layers { background:#f6dcbf; position:relative; overflow:hidden; }
header.layers::after { content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
 background:radial-gradient(40px 18px at 40px 0,#f6dcbf 98%,transparent) 0 0/80px 22px repeat-x, linear-gradient(#e7b98a 0 22px,#c98a52 22px 44px,#f3d2a9 44px); }
.brand { font-family:"DM Serif Display",serif; font-size:30px; text-decoration:none; color:#3b2516; }
.hero { padding:28px 0 110px; max-width:600px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px,5.4vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#5d4330; font-size:18.5px; margin:0 0 22px; }
.items { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.items div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.items b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .items span { color:var(--muted); font-size:15.5px; }
@media (max-width:820px){ .items{ grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="layers"><div class="wrap"><div class="top"><a class="brand" href="#">Nako.bakery</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995555158724" data-i="call"></a></div></div></div></header>
<main class="wrap"><section><p class="kick" data-i="iK"></p><h2 data-i="iH"></h2><div class="items"><div><b data-i="i1"></b><span data-i="i1d"></span></div><div><b data-i="i2"></b><span data-i="i2d"></span></div><div><b data-i="i3"></b><span data-i="i3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="cnt"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 555 15 87 24</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Nako.bakery+6+Griboedov+St+Batumi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995555158724";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია Nako.bakery-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"საცხობი · ბათუმი", h1:"ცხელი ცომეული ბათუმში, ყოველდღე", lead:"გრიბოედოვის 6 და ინასარიძის 9. ღიაა ყოველდღე 10:00-დან 21:00-მდე.",
 cta:"წინასწარ შეკვეთა", call:"დარეკვა",
 iK:"ცომეული", iH:"რას აქებენ სტუმრები", i1:"ვაშლის რულეტი", i1d:"კაკლით.", i2:"ცხელი ფენოვანი ცომეული", i2d:"ახლად გამომცხვარი.", i3:"ვეგეტარიანული არჩევანი", i3d:"არჩევანი ვეგეტარიანელებისთვისაც.",
 bK:"შეკვეთა", bH:"შეუკვეთე წინასწარ", bLead:"აირჩიე, რა გინდა, რამდენი და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გინდა?", q2:"რამდენი?", q3:"როდის?",
 what:["ვაშლის რულეტი","ფენოვანი ცომეული","ვეგეტარიანული"], cnt:["1–2","3–5","6+"], when:["დღეს","ხვალ დილით","ხვალ საღამოს"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა შევუკვეთო: ${a.toLowerCase()}, ${b} ცალი. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 addr:"გრიბოედოვის ქ. 6 / ინასარიძის ქ. 9, ბათუმი", foot:"Nako.bakery · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Nako.bakery by Vitrina Studio. This is not the official website.",
 hK:"Bakery · Batumi", h1:"Hot pastries in Batumi, every day", lead:"6 Griboedov St and 9 Inasaridze St. Open daily 10:00–21:00.",
 cta:"Order ahead", call:"Call",
 iK:"Pastries", iH:"What guests praise", i1:"Apple roll", i1d:"With walnuts.", i2:"Hot puff pastry", i2d:"Freshly baked.", i3:"Vegetarian options", i3d:"For guests who don't eat meat.",
 bK:"Order", bH:"Order ahead", bLead:"Choose what, how many and when. A ready message opens in WhatsApp.",
 q1:"What would you like?", q2:"How many?", q3:"When?",
 what:["Apple roll","Puff pastry","Vegetarian"], cnt:["1–2","3–5","6+"], when:["Today","Tomorrow morning","Tomorrow evening"],
 msg:(a,b,c,n)=>`Hello! I'd like to order: ${a.toLowerCase()}, ${b} pcs. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 addr:"6 Griboedov St / 9 Inasaridze St, Batumi", foot:"Nako.bakery · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Nako.bakery от Vitrina Studio. Это не официальный сайт.",
 hK:"Пекарня · Батуми", h1:"Горячая выпечка в Батуми каждый день", lead:"Ул. Грибоедова, 6 и ул. Инасаридзе, 9. Ежедневно 10:00–21:00.",
 cta:"Заказать заранее", call:"Позвонить",
 iK:"Выпечка", iH:"Что хвалят гости", i1:"Яблочный рулет", i1d:"С грецким орехом.", i2:"Горячая слойка", i2d:"Только из печи.", i3:"Вегетарианское", i3d:"Для гостей, которые не едят мясо.",
 bK:"Заказ", bH:"Закажите заранее", bLead:"Выберите что, сколько и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что хотите?", q2:"Сколько?", q3:"Когда?",
 what:["Яблочный рулет","Слойка","Вегетарианское"], cnt:["1–2","3–5","6+"], when:["Сегодня","Завтра утром","Завтра вечером"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу заказать: ${a.toLowerCase()}, ${b} шт. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 addr:"ул. Грибоедова, 6 / ул. Инасаридзе, 9, Батуми", foot:"Nako.bakery · демо-сайт"}};
const HOURS = ["10:00\u201321:00", "10:00\u201321:00", "10:00\u201321:00", "10:00\u201321:00", "10:00\u201321:00", "10:00\u201321:00", "10:00\u201321:00"];
const GROUPS = ["what", "cnt", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
