<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }

.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }

section { padding: 60px 0; }

.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

 --radius:2px; --chip-radius:999px; --btn-radius:999px;

:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.rails { background:#ebe4d8; position:relative; overflow:hidden; }
header.rails::after { content:""; position:absolute; left:0; right:0; bottom:46px; height:26px; border-top:3px solid #c9bda9; border-bottom:3px solid #c9bda9;
 background:repeating-linear-gradient(90deg,transparent 0 22px,#d8ccb8 22px 24px); opacity:.8; }
.brand { font-family:"Jost",sans-serif; font-weight:500; letter-spacing:.18em; font-size:15px; text-decoration:none; text-transform:uppercase; }
.hero { padding:36px 0 120px; max-width:640px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:500; font-size:clamp(34px,5.2vw,56px); line-height:1.1; margin:0 0 16px; text-wrap:balance; }
.hero p { color:var(--muted); font-size:18.5px; margin:0 0 22px; }
.badge { display:inline-flex; gap:8px; align-items:baseline; border:1px solid #c9bda9; padding:8px 16px; border-radius:999px; margin-bottom:18px; font-size:15px; }
.badge b { color:var(--accent); font-size:18px; }
.why { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--ink); }
.why div { padding:22px 20px 22px 0; border-bottom:1px solid var(--line); }
.why b { display:block; font-family:var(--display); font-size:21px; font-weight:500; margin-bottom:6px; } .why span { color:var(--muted); font-size:15.5px; }
@media (max-width:820px){ .why{ grid-template-columns:1fr; } .hero{ padding-bottom:100px; } }

 stat:"Google-ზე, 80-ზე მეტი შეფასება", h1:"რეფორმერ პილატესი სულხან ცინცაძის ქუჩაზე", lead:"კერძო სტუდია. სამუშაო დღეებში 8:00-დან 22:00-მდე, შაბათ-კვირასაც ღიაა.",
 cta:"ჩაწერა", call:"დარეკვა",
 wK:"სტუდია", wH:"რატომ მოდიან", w1:"პირველად?", w1d:"ბევრი სტუმარი პირველად აქ ცდის რეფორმერს.", w2:"მშვიდი გარემო", w2d:"სტუმრები წერენ მყუდრო და მშვიდ ატმოსფეროზე.", w3:"ინდივიდუალურად", w3d:"ვარჯიში შენს დონეზე მორგებული.",
 bK:"ჩაწერა", bH:"ჩაეწერე ვარჯიშზე", bLead:"აირჩიე დონე, დღის მონაკვეთი და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"გივარჯიშია რეფორმერზე?", q2:"დღის რომელ მონაკვეთში?", q3:"როდის?",
 lvl:["პირველად ვიქნები","უკვე ვვარჯიშობ"], part:["დილით","დღისით","საღამოს"], when:["ამ კვირაში","შემდეგ კვირაში"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა ჩაწერა რეფორმერ პილატესზე. ${a}. სასურველი დრო: ${b.toLowerCase()}, ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,

en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Reformer Pilates Private Studio by Vitrina Studio. This is not the official website.",

 wK:"Studio", wH:"Why people come", w1:"First time?", w1d:"Many guests try the reformer here for the first time.", w2:"Calm space", w2d:"Guests mention the calm, cosy atmosphere.", w3:"One-to-one", w3d:"Sessions adapted to your level.",
 bK:"Booking", bH:"Book a session", bLead:"Choose your level, time of day and when. A ready message opens in WhatsApp.",
 q1:"Have you done reformer before?", q2:"Time of day?", q3:"When?",
 lvl:["It's my first time","I already train"], part:["Morning","Afternoon","Evening"], when:["This week","Next week"],
 msg:(a,b,c,n)=>`Hello! I'd like to book a reformer session. ${a}. Preferred time: ${b.toLowerCase()}, ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 addr:"5 Sulkhan Tsintsadze St, Tbilisi", foot:"Reformer Pilates Private Studio · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Reformer Pilates Private Studio от Vitrina Studio. Это не официальный сайт.",
 stat:"в Google, более 80 отзывов", h1:"Пилатес на реформере на улице Сулхана Цинцадзе", lead:"Частная студия. По будням 8:00–22:00, работает и в выходные.",

 wK:"Студия", wH:"Почему приходят", w1:"Впервые?", w1d:"Многие гости впервые пробуют реформер именно здесь.", w2:"Спокойная атмосфера", w2d:"Гости пишут об уютной и спокойной атмосфере.", w3:"Индивидуально", w3d:"Занятия под ваш уровень.",
 bK:"Запись", bH:"Запишитесь на занятие", bLead:"Выберите уровень, время дня и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Занимались на реформере?", q2:"Время дня?", q3:"Когда?",
 lvl:["Буду впервые","Уже занимаюсь"], part:["Утром","Днём","Вечером"], when:["На этой неделе","На следующей неделе"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу записаться на реформер. ${a}. Удобное время: ${b.toLowerCase()}, ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 addr:"ул. Сулхана Цинцадзе, 5, Тбилиси", foot:"Reformer Pilates Private Studio · демо-сайт"}};
const HOURS = ["8:00\u201322:00", "8:00\u201322:00", "8:00\u201322:00", "8:00\u201322:00", "8:00\u201322:00", "11:00\u201316:00", "13:00\u201317:00"];
const GROUPS = ["lvl", "part", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
