<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: lunch under the vine alley — leafy green pergola stripes over warm cream, grape-purple accents. */
 --bg:#f7f4ea; --ink:#233021; --muted:#5f6a59; --accent:#6b3a6e; --on-accent:#fff; --line:#e2dccb; --card:#fffdf6; --card-ink:#233021;
 --radius:16px; --chip-radius:999px; --btn-radius:999px;
 --display:"Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
header.wh { background:#2f4a2b; color:#f7f4ea; position:relative; overflow:hidden; }
header.wh::before { content:""; position:absolute; inset:0 0 auto 0; height:34px; background:repeating-linear-gradient(90deg,#4f7a3f 0 18px,#3a5c30 18px 40px); opacity:.9; }
.vine { position:absolute; right:8%; top:150px; display:flex; flex-direction:column; align-items:center; gap:3px; transform:rotate(-8deg); }
.vine .stem { width:6px; height:26px; background:#8a6a3a; border-radius:3px; position:relative; margin-bottom:2px; }
.vine .stem::after { content:""; position:absolute; left:4px; top:2px; width:46px; height:30px; background:#6d9a4f; border-radius:0 30px 0 30px; transform:rotate(-18deg); }
.vine .row { display:flex; gap:3px; }
.vine i { width:30px; height:30px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#b77bbb 0 18%,#8d4d91 40%,#5e2f62 100%); display:block; }
.brand { font-family:"Noto Serif Georgian",serif; font-weight:700; font-size:21px; text-decoration:none; }
.top { position:relative; z-index:1; padding-top:44px !important; }
.hero .kick { color:#c8e0a8; } .hero p { color:#dbe5d2; } .hero .send { background:#c8e0a8; color:#233021; } .hero .ghost { color:#f7f4ea; }
footer { background:#2f4a2b; color:#dbe5d2; }
@media (max-width:820px){ .vine{ display:none; } }

.hero { padding:30px 0 90px; max-width:640px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(34px,5.2vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { font-size:18.5px; margin:0 0 22px; }
.facts { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.facts div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.facts b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .facts span { color:var(--muted); font-size:15.5px; }
.grapes { display:flex; flex-wrap:wrap; gap:10px; } .grapes span { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font-weight:600; }
@media (max-width:820px){ .facts{ grid-template-columns:1fr; } }

</style>

<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><div class="addr"><div class="k" data-i="whenK"></div><div class="v" data-i="whenV"></div></div><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 598 22 87 07</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Tevdorashvilis+Marani+Akhasheni" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995598228707";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია თევდორაშვილების მარნისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"ახაშენი · კახეთი", h1:"საოჯახო მარანი და სტუმრობა ახაშენში", lead:"2017 წლიდან მასპინძლობენ სტუმრებს: დეგუსტაცია, მასტერკლასები და სადილი ვაზის ჩრდილში.",
 cta:"ვიზიტის დაგეგმვა", call:"დარეკვა",
 aK:"სტუმრობა", aH:"რას გთავაზობთ", a1:"მასტერკლასები", a1d:"პურის გამოცხობა, ჩურჩხელა და ხინკლის გაკეთება.", a2:"სადილი და ვახშამი", a2d:"ქართული კერძები ცალკე დარბაზში ან ვაზის ხეივანში.", a3:"ბავშვებისთვის", a3d:"ბატუტი და საბავშვო აუზი.",
 gK:"დეგუსტაცია", gH:"რას დააგემოვნებთ", g1:"რქაწითელი", g2:"საფერავი", g3:"ჭაჭა",
 bK:"ვიზიტი", bH:"დაგეგმე ვიზიტი", bLead:"აირჩიე, რა გაინტერესებს, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გაინტერესებს?", q2:"რამდენი ხართ?", q3:"როდის?",
 what:["დეგუსტაცია","მასტერკლასი","ღამის გათევა"], ppl:["2","3–5","6+"], when:["ამ კვირაში","შემდეგ კვირაში","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მაინტერესებს: ${a.toLowerCase()}. ვართ: ${b}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 whenK:"ვიზიტამდე", whenV:"დაგვირეკეთ ან მოგვწერეთ", addr:"სოფელი ახაშენი 42, კახეთი", foot:"თევდორაშვილების მარანი · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Tevdorashvili's Marani by Vitrina Studio. This is not the official website.",
 hK:"Akhasheni · Kakheti", h1:"A family marani and stay in Akhasheni", lead:"Hosting guests since 2017: tastings, masterclasses and lunch in the shade of the vines.",
 cta:"Plan a visit", call:"Call",
 aK:"Your visit", aH:"What we offer", a1:"Masterclasses", a1d:"Bread baking, churchkhela and khinkali.", a2:"Lunch and dinner", a2d:"Georgian dishes in a separate hall or under the vine alley.", a3:"For kids", a3d:"A trampoline and a children's pool.",
 gK:"Tasting", gH:"What you'll taste", g1:"Rkatsiteli", g2:"Saperavi", g3:"Chacha",
 bK:"Visit", bH:"Plan your visit", bLead:"Choose what you'd like, group size and when. A ready message opens in WhatsApp.",
 q1:"What are you interested in?", q2:"How many?", q3:"When?",
 what:["Tasting","Masterclass","Overnight stay"], ppl:["2","3–5","6+"], when:["This week","Next week","Later"],
 msg:(a,b,c,n)=>`Hello! I'm interested in: ${a.toLowerCase()}. People: ${b}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 whenK:"Before visiting", whenV:"Call or message us", addr:"Akhasheni 42, Kakheti", foot:"Tevdorashvili's Marani · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Tevdorashvili's Marani от Vitrina Studio. Это не официальный сайт.",
 hK:"Ахашени · Кахетия", h1:"Семейный марани и гостевой дом в Ахашени", lead:"Принимают гостей с 2017 года: дегустации, мастер-классы и обед в тени виноградной лозы.",
 cta:"Спланировать визит", call:"Позвонить",
 aK:"Визит", aH:"Что мы предлагаем", a1:"Мастер-классы", a1d:"Выпечка хлеба, чурчхела и хинкали.", a2:"Обед и ужин", a2d:"Грузинская кухня в отдельном зале или в виноградной аллее.", a3:"Для детей", a3d:"Батут и детский бассейн.",
 gK:"Дегустация", gH:"Что вы попробуете", g1:"Ркацители", g2:"Саперави", g3:"Чача",
 bK:"Визит", bH:"Спланируйте визит", bLead:"Выберите, что интересно, сколько вас и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что интересует?", q2:"Сколько вас?", q3:"Когда?",
 what:["Дегустация","Мастер-класс","Ночлег"], ppl:["2","3–5","6+"], when:["На этой неделе","На следующей неделе","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Интересует: ${a.toLowerCase()}. Нас: ${b}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 whenK:"Перед визитом", whenV:"Позвоните или напишите нам", addr:"село Ахашени, 42, Кахетия", foot:"Tevdorashvili's Marani · демо-сайт"}};
const HOURS = [null, null, null, null, null, null, null];
const GROUPS = ["what", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
