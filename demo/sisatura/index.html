<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sisatura · Ethno Village Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@600;800&family=Noto+Sans+Georgian:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a Megrelian oda on stilts in lush green — wooden plank texture, subtropical leaf green, warm adjika red. */
 --bg:#f4f6ee; --ink:#1f2a1c; --muted:#5a6655; --accent:#b3361f; --on-accent:#fff; --line:#dde3d2; --card:#fff; --card-ink:#1f2a1c;
 --radius:10px; --chip-radius:999px; --btn-radius:10px;
 --display:"Noto Serif Georgian",serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
header.oda { background:#2d4a26; color:#f4f6ee; position:relative; overflow:hidden; }
.house { position:absolute; right:6%; bottom:0; width:240px; height:230px; }
.house::before { content:""; position:absolute; left:0; right:0; top:0; height:70px; background:#7a4a2a; clip-path:polygon(50% 0,100% 100%,0 100%); }
.house::after { content:""; position:absolute; left:20px; right:20px; top:70px; height:100px; background:repeating-linear-gradient(90deg,#b07a4c 0 22px,#9c6a40 22px 24px); box-shadow:0 60px 0 -40px #5a3a20; }
.house i { position:absolute; bottom:0; width:12px; height:60px; background:#5a3a20; } .house i:nth-child(1){left:34px} .house i:nth-child(2){right:34px} .house i:nth-child(3){left:114px}
.brand { font-family:"Noto Serif Georgian",serif; font-weight:800; font-size:22px; text-decoration:none; }
.hero { padding:28px 0 80px; max-width:600px; position:relative; z-index:1; }
.hero .kick { color:#c8dfb0; }
.hero h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px,5.2vw,56px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#d3dccb; font-size:18.5px; margin:0 0 22px; } .hero .ghost { color:#f4f6ee; }
.facts { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.facts div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.facts b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .facts span { color:var(--muted); font-size:15.5px; }
footer { background:#2d4a26; color:#d3dccb; }
@media (max-width:820px){ .facts{ grid-template-columns:1fr; } .house{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="oda"><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">სისატურა</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995599236569" data-i="call"></a></div></div>
<div class="house" aria-hidden="true"><i></i><i></i><i></i></div></div></header>
<main class="wrap"><section><p class="kick" data-i="aK"></p><h2 data-i="aH"></h2><div class="facts"><div><b data-i="a1"></b><span data-i="a1d"></span></div><div><b data-i="a2"></b><span data-i="a2d"></span></div><div><b data-i="a3"></b><span data-i="a3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><div class="addr"><div class="k" data-i="whenK"></div><div class="v" data-i="whenV"></div></div><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 599 23 65 69</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Sisatura+Chkhoria+Zugdidi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995599236569";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია სისატურასთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"ეთნოსოფელი · ჭხორია, ზუგდიდი", h1:"პატარა სამეგრელო სამ ჰექტარზე", lead:"ეთნოგრაფიული სოფელი, სადაც 2019 წლიდან სტუმრებს ოჯახი ხვდება. მეგრული სამზარეულო ადგილობრივი პროდუქტებით.",
 cta:"ვიზიტის დაჯავშნა", call:"დარეკვა",
 aK:"სტუმრობა", aH:"რას გთავაზობთ", a1:"მეგრული სამზარეულო", a1d:"ტრადიციული კერძები ადგილობრივი პროდუქტებისგან.", a2:"რიტუალები და მომზადება", a2d:"სტუმრები თავადაც მონაწილეობენ.", a3:"აღდგენილი სახლები", a3d:"ძველი მეგრული საცხოვრებლები.",
 bK:"ვიზიტი", bH:"დაჯავშნე ვიზიტი", bLead:"ვიზიტი წინასწარი დაჯავშნით. აირჩიე, რა გაინტერესებს, რამდენი ხართ და როდის, და WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გაინტერესებს?", q2:"რამდენი ხართ?", q3:"როდის?",
 what:["ექსკურსია სოფელში","მეგრული სადილი","ორივე"], ppl:["2–4","5–10","11+"], when:["ამ კვირაში","შემდეგ კვირაში","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მაინტერესებს: ${a.toLowerCase()}. ვართ: ${b}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 whenK:"დაჯავშნა", whenV:"წინასწარი დაჯავშნით", addr:"სოფელი ჭხორია, ზუგდიდის მუნიციპალიტეტი", foot:"სისატურა · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Sisatura by Vitrina Studio. This is not the official website.",
 hK:"Ethno village · Chkhoria, Zugdidi", h1:"A small Samegrelo on three hectares", lead:"An ethnographic village where the family has welcomed guests since 2019. Megrelian cooking with local produce.",
 cta:"Book a visit", call:"Call",
 aK:"Your visit", aH:"What we offer", a1:"Megrelian cuisine", a1d:"Traditional dishes from local produce.", a2:"Rituals & cooking", a2d:"Guests take part themselves.", a3:"Restored houses", a3d:"Old Megrelian dwellings.",
 bK:"Visit", bH:"Book your visit", bLead:"Booking required. Choose what you'd like, group size and when, and a ready message opens in WhatsApp.",
 q1:"What are you interested in?", q2:"How many?", q3:"When?",
 what:["Village tour","Megrelian lunch","Both"], ppl:["2–4","5–10","11+"], when:["This week","Next week","Later"],
 msg:(a,b,c,n)=>`Hello! I'm interested in: ${a.toLowerCase()}. People: ${b}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 whenK:"Booking", whenV:"Booking required", addr:"Chkhoria village, Zugdidi municipality", foot:"Sisatura · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Sisatura от Vitrina Studio. Это не официальный сайт.",
 hK:"Этнодеревня · Чхориа, Зугдиди", h1:"Маленькая Самегрело на трёх гектарах", lead:"Этнографическая деревня, где с 2019 года гостей встречает семья. Мегрельская кухня из местных продуктов.",
 cta:"Забронировать визит", call:"Позвонить",
 aK:"Визит", aH:"Что мы предлагаем", a1:"Мегрельская кухня", a1d:"Традиционные блюда из местных продуктов.", a2:"Обряды и готовка", a2d:"Гости участвуют сами.", a3:"Восстановленные дома", a3d:"Старые мегрельские жилища.",
 bK:"Визит", bH:"Забронируйте визит", bLead:"Только по брони. Выберите, что интересно, сколько вас и когда — в WhatsApp откроется готовое сообщение.",
 q1:"Что интересует?", q2:"Сколько вас?", q3:"Когда?",
 what:["Экскурсия по деревне","Мегрельский обед","И то, и другое"], ppl:["2–4","5–10","11+"], when:["На этой неделе","На следующей неделе","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Интересует: ${a.toLowerCase()}. Нас: ${b}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 whenK:"Бронирование", whenV:"Только по брони", addr:"село Чхориа, Зугдидский муниципалитет", foot:"Sisatura · демо-сайт"}};
const HOURS = [null, null, null, null, null, null, null];
const GROUPS = ["what", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
