<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nari Ceramics Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a potter's courtyard — raw clay, terracotta glaze drips, a round kiln-window badge. */
 --bg:#f4ece2; --ink:#2b1d16; --muted:#6e5a4c; --accent:#b4532a; --on-accent:#fff; --line:#e2d3c2; --card:#fbf6f0; --card-ink:#2b1d16;
 --radius:26px; --chip-radius:999px; --btn-radius:999px;
 --display:"Fraunces","Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.clay { background:#e6d3bf; position:relative; overflow:hidden; }
header.clay::before { content:""; position:absolute; left:0; right:0; top:0; height:26px;
  background: radial-gradient(circle at 20px 0, #b4532a 0 14px, transparent 15px) 0 0/56px 26px repeat-x; }
.brand { font-family:"Fraunces",serif; font-weight:800; font-size:26px; text-decoration:none; letter-spacing:.01em; }
.hero { display:grid; grid-template-columns:1.15fr .85fr; gap:34px; align-items:center; padding:30px 0 70px; }
.hero h1 { font-family:var(--display); font-weight:800; font-size:clamp(36px,5.4vw,60px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:var(--muted); font-size:18.5px; max-width:30em; margin:0 0 24px; }
.hero .ghost { color:var(--ink); }
.pot { justify-self:center; width:min(300px,70vw); aspect-ratio:1; border-radius:50%; background:#2b1d16; display:grid; place-items:center; box-shadow:inset 0 0 0 14px #b4532a, inset 0 0 0 22px #2b1d16; }
.pot svg { width:58%; }
.offer { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.offer div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 20px; }
.offer i { font-style:normal; font-size:28px; display:block; margin-bottom:8px; }
.offer b { font-family:var(--display); font-size:20px; display:block; margin-bottom:4px; }
.offer span { color:var(--muted); font-size:15px; }
.gift { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; background:#2b1d16; color:#f4ece2; border-radius:var(--radius); padding:34px; }
.gift h2 { margin:0 0 8px; } .gift p { color:#d9c6b4; margin:0; max-width:34em; }
.gift .send { background:#e9a36c; color:#2b1d16; }
footer { background:#2b1d16; color:#d9c6b4; }
@media (max-width:820px){ .hero,.gift{ grid-template-columns:1fr; } .offer{ grid-template-columns:1fr 1fr; } .pot{ width:180px; } }
@media (max-width:560px){ .hero{ padding:18px 0 44px; gap:20px; } .pot{ display:none; } .offer{ grid-template-columns:1fr; gap:10px; }
 .offer div{ display:grid; grid-template-columns:auto 1fr; column-gap:14px; padding:16px 18px; } .offer i{ grid-row:span 2; margin:0; font-size:26px; } .offer b{ margin:0; }
 .gift{ padding:26px 22px; } .gift .send{ width:100%; } .visit{ gap:14px; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="clay">
 <div class="wrap">
  <div class="top"><a class="brand" href="#">Nari</a>
   <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
  <div class="hero">
   <div><h1 data-i="h1"></h1><p data-i="lead"></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="https://www.instagram.com/nari_ceramicstudio/" target="_blank" rel="noopener">Instagram</a></div></div>
   <div class="pot" aria-hidden="true"><svg viewBox="0 0 120 120" fill="none" stroke="#f4ece2" stroke-width="4" stroke-linecap="round"><path d="M42 22h36M46 22c0 10-18 22-18 46 0 22 14 34 32 34s32-12 32-34c0-24-18-36-18-46"/><path d="M34 70c16 6 36 6 52 0" stroke="#e9a36c"/></svg></div>
  </div>
 </div>
</header>
<main class="wrap">
 <section>
  <p class="kick" data-i="oK"></p><h2 data-i="oH"></h2>
  <div class="offer">
   <div><i>🏺</i><b data-i="o1"></b><span data-i="o1d"></span></div><div><i>🎓</i><b data-i="o2"></b><span data-i="o2d"></span></div>
   <div><i>🪵</i><b data-i="o3"></b><span data-i="o3d"></span></div><div><i>🔥</i><b data-i="o4"></b><span data-i="o4d"></span></div>
  </div>
 </section>
 <section id="book">
  <div class="book">
   <div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
   <form class="card" onsubmit="return false">
    <fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset>
    <fieldset><legend data-i="q2"></legend><div class="chips" id="who"></div></fieldset>
    <fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset>
    <fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
    <div class="preview" id="pv" aria-live="polite"></div>
    <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
   </form>
  </div>
 </section>
 <section>
  <div class="gift"><div><h2 data-i="gH"></h2><p data-i="gP"></p></div><a class="send" href="#book" data-i="gCta"></a></div>
 </section>
 <section>
  <h2 data-i="visitH"></h2>
  <div class="visit"><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 598 62 07 65</div></div>
   <div class="addr"><a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Nari+Ceramic+Studio+9+Ivane+Javakhishvili+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div>
 </section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995598620765";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია Nari Ceramics-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 h1:"აღმოაჩინე ახალი ჰობი ნარიში", lead:"კერამიკის სტუდია ჯავახიშვილის ქუჩაზე: ვორქშოპები, გაკვეთილები და სამუშაო სივრცე.",
 cta:"ადგილის დაჯავშნა",
 oK:"ნარიში", oH:"რას გთავაზობთ", o1:"ვორქშოპი", o1d:"ერთჯერადი შეხვედრა, მეგობრებთან ან მარტო.", o2:"გაკვეთილები", o2d:"სისტემური სწავლა მათთვის, ვისაც ღრმად უნდა.", o3:"სამუშაო სივრცე", o3d:"მაგიდა და ინსტრუმენტები თქვენი პროექტებისთვის.", o4:"ღუმელი", o4d:"ნამუშევრის გამოწვა სტუდიის ღუმელში.",
 bK:"დაჯავშნა", bH:"აირჩიე და მოგვწერე", bLead:"აირჩიე, რა გაინტერესებს, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გაინტერესებს?", q2:"რამდენი ხართ?", q3:"როდის?", q4:"შენი სახელი",
 what:["ვორქშოპი","გაკვეთილები","სამუშაო სივრცე","საჩუქრის ვაუჩერი"], who:["მარტო","ორნი","3–4","ჯგუფი"], when:["ამ კვირაში","შაბათ-კვირას","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მაინტერესებს: ${a.toLowerCase()}. ვართ: ${b.toLowerCase()}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 gH:"საჩუქრად ვაუჩერი", gP:"აჩუქე ახლობელს ვორქშოპი ნარიში: ახალი ჰობი და ხელით შექმნილი ნივთი.", gCta:"ვაუჩერის მოთხოვნა",
 visitH:"სად ვართ", addrK:"მისამართი", addr:"ივანე ჯავახიშვილის ქ. 9, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"Nari Ceramics · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for Nari Ceramics by Vitrina Studio. This is not the official website.",
 h1:"Discover a new hobby at Nari", lead:"A ceramics studio on Javakhishvili Street: workshops, lessons and a workspace.",
 cta:"Book a spot",
 oK:"At Nari", oH:"What we offer", o1:"Workshop", o1d:"A one-time session, with friends or on your own.", o2:"Lessons", o2d:"Regular classes for those who want to go deeper.", o3:"Workspace", o3d:"A table and tools for your own projects.", o4:"Kiln", o4d:"Firing your pieces in the studio kiln.",
 bK:"Booking", bH:"Choose and message us", bLead:"Pick what you're interested in, how many of you, and when. A ready message opens in WhatsApp.",
 q1:"What are you interested in?", q2:"How many people?", q3:"When?", q4:"Your name",
 what:["Workshop","Lessons","Workspace","Gift voucher"], who:["Just me","Two","3–4","A group"], when:["This week","Weekend","Later"],
 msg:(a,b,c,n)=>`Hello! I'm interested in: ${a.toLowerCase()}. People: ${b.toLowerCase()}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 gH:"Give a voucher", gP:"Gift someone a workshop at Nari: a new hobby and something made by hand.", gCta:"Ask for a voucher",
 visitH:"Where we are", addrK:"Address", addr:"9 Ivane Javakhishvili St, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"Nari Ceramics · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для Nari Ceramics от Vitrina Studio. Это не официальный сайт.",
 h1:"Откройте новое хобби в Нари", lead:"Керамическая студия на улице Джавахишвили: воркшопы, уроки и рабочее пространство.",
 cta:"Забронировать место",
 oK:"В Нари", oH:"Что мы предлагаем", o1:"Воркшоп", o1d:"Разовое занятие — с друзьями или самостоятельно.", o2:"Уроки", o2d:"Регулярные занятия для тех, кто хочет глубже.", o3:"Рабочее пространство", o3d:"Стол и инструменты для ваших проектов.", o4:"Печь", o4d:"Обжиг ваших работ в печи студии.",
 bK:"Запись", bH:"Выберите и напишите нам", bLead:"Выберите, что интересно, сколько вас и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что вас интересует?", q2:"Сколько вас?", q3:"Когда?", q4:"Ваше имя",
 what:["Воркшоп","Уроки","Рабочее пространство","Подарочный ваучер"], who:["Один","Двое","3–4","Группа"], when:["На этой неделе","В выходные","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Интересует: ${a.toLowerCase()}. Нас: ${b.toLowerCase()}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 gH:"Подарите ваучер", gP:"Подарите близкому воркшоп в Нари: новое хобби и вещь, сделанную своими руками.", gCta:"Запросить ваучер",
 visitH:"Где мы", addrK:"Адрес", addr:"ул. Ивана Джавахишвили, 9, Тбилиси", phoneK:"Телефон", map:"Открыть на карте", foot:"Nari Ceramics · демо-сайт"}};
const HOURS = [null, null, null, null, null, null, null];
const GROUPS = ["what", "who", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
