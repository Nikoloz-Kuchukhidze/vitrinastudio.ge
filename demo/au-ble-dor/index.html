<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Au Blé d'or by Jean-Jacques Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a Breton baker's chalkboard over a field of old red wheat — Brittany blue, wheat gold, flour white. */
 --bg:#f7f1e6; --ink:#1d2a44; --muted:#5f6478; --accent:#1f3d7a; --on-accent:#fff; --line:#e2d6bf; --card:#fffdf8; --card-ink:#1d2a44;
 --radius:6px; --chip-radius:4px; --btn-radius:4px;
 --display:"Cormorant Garamond","Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.field { background:#1f3d7a; color:#f7f1e6; position:relative; overflow:hidden; }
header.field::after { content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
  background: repeating-linear-gradient(100deg, #b5462f 0 3px, transparent 3px 14px), repeating-linear-gradient(80deg, #d9a441 0 3px, transparent 3px 11px); opacity:.55;
  -webkit-mask: linear-gradient(transparent, #000); mask: linear-gradient(transparent, #000); }
.brand { font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:700; font-size:26px; text-decoration:none; }
.hero { padding:30px 0 110px; max-width:760px; position:relative; z-index:1; }
.hero .by { font-family:"Cormorant Garamond",serif; font-style:italic; font-size:22px; color:#e9c97a; margin:0 0 6px; }
.hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(36px,5.4vw,60px); line-height:1.08; margin:0 0 18px; text-wrap:balance; }
.hero p { color:#d9deea; font-size:18.5px; max-width:32em; margin:0 0 24px; }
header.field .langs button[aria-pressed="true"] { background:#e9c97a; border-color:#e9c97a; color:#1d2a44; }
.hero .send { background:#e9c97a; color:#1d2a44; } .hero .ghost { color:#f7f1e6; }
.path { display:grid; grid-template-columns:repeat(4,1fr); gap:0; counter-reset:s; border-top:2px solid var(--ink); }
.path div { padding:20px 18px 6px 0; border-right:1px dashed var(--line); counter-increment:s; }
.path div:last-child { border-right:0; }
.path div::before { content:"0" counter(s); font-family:"Cormorant Garamond",serif; font-size:34px; font-weight:700; color:#b5462f; display:block; }
.path b { display:block; font-size:17px; margin:4px 0; } .path span { color:var(--muted); font-size:15px; }
.shelf { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.shelf div { background:var(--card); border:1px solid var(--line); padding:18px; border-radius:var(--radius); }
.shelf b { font-family:var(--display); font-size:21px; display:block; }
.shelf span { color:var(--muted); font-size:14.5px; }
.note { color:var(--muted); font-size:14px; margin-top:10px; }
footer { background:#1d2a44; color:#d9deea; }
@media (max-width:820px){ .path{ grid-template-columns:1fr 1fr; } .shelf{ grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="field">
 <div class="wrap">
  <div class="top"><a class="brand" href="#">Au Blé d'or</a>
   <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="fr" aria-pressed="false">FR</button></div></div>
  <div class="hero"><p class="by">by Jean-Jacques</p><h1 data-i="h1"></h1><p data-i="lead"></p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#reserve" data-i="cta"></a><a class="ghost" href="tel:+995591133478" data-i="call"></a></div></div>
 </div>
</header>
<main class="wrap">
 <section>
  <p class="kick" data-i="pK"></p><h2 data-i="pH"></h2>
  <div class="path"><div><b data-i="p1"></b><span data-i="p1d"></span></div><div><b data-i="p2"></b><span data-i="p2d"></span></div><div><b data-i="p3"></b><span data-i="p3d"></span></div><div><b data-i="p4"></b><span data-i="p4d"></span></div></div>
 </section>
 <section>
  <p class="kick" data-i="sK"></p><h2 data-i="sH"></h2>
  <div class="shelf"><div><b data-i="b1"></b><span data-i="b1d"></span></div><div><b data-i="b2"></b><span data-i="b2d"></span></div><div><b data-i="b3"></b><span data-i="b3d"></span></div></div>
  <p class="note" data-i="sNote"></p>
 </section>
 <section id="reserve">
  <div class="book">
   <div><p class="kick" data-i="oK"></p><h2 data-i="oH"></h2><p class="lead" data-i="oLead"></p></div>
   <form class="card" onsubmit="return false">
    <fieldset><legend data-i="q1"></legend><div class="chips" id="bread"></div></fieldset>
    <fieldset><legend data-i="q2"></legend><div class="chips" id="day"></div></fieldset>
    <fieldset><legend><label for="nm" data-i="q3"></label></legend><input type="text" id="nm"></fieldset>
    <div class="preview" id="pv" aria-live="polite"></div>
    <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
   </form>
  </div>
 </section>
 <section>
  <h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 591 13 34 78</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Au+Bl%C3%A9+d%27or+28a+Zandukeli+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div>
 </section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995591133478";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია Au Blé d'or-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 h1:"პური ძველი ქართული წითელი დოლის ხორბლისგან", lead:"ბრეტანელი მცხობელი, საკუთარი ყანები არღოხში და პური საფუარის გარეშე. ვერაში, ზანდუკელის ქუჩაზე.",
 cta:"პურის დაჯავშნა", call:"დარეკვა",
 pK:"ყანიდან პურამდე", pH:"როგორ ცხვება ჩვენი პური",
 p1:"ყანა", p1d:"წითელი დოლი, ძველი ქართული ჯიში, საკუთარ ყანებში, არღოხში.", p2:"წისქვილი", p2d:"ფქვილი იფქვება ცხობამდე, ახალი.", p3:"ცომი", p3d:"საფუარის გარეშე, წყაროს წყლით.", p4:"დახლი", p4d:"ახალი პური და ტკბილეული, ვერაში.",
 sK:"დახლზე", sH:"რას იპოვით", b1:"პური", b1d:"ჭვავის პური მარცვლებით და სხვა სახეობები.", b2:"ტკბილი", b2d:"ნიგვზისა და თაფლის ტარტი, ჩიზქეიქი, ორცხობილა.", b3:"სახლისთვის", b3d:"ერბო, თაფლი, ყველი.",
 sNote:"ასორტიმენტი დღის მიხედვით იცვლება. მოგვწერეთ და გეტყვით, რა არის დღეს.",
 oK:"დაჯავშნა", oH:"გადაგიდებთ პურს", oLead:"აირჩიეთ პური და დღე. WhatsApp-ში მზა შეტყობინება გაიხსნება, დაჯავშნას იქ დაგიდასტურებთ.",
 q1:"რომელი პური?", q2:"როდის გაიტანთ?", q3:"თქვენი სახელი",
 bread:["ჭვავის პური მარცვლებით","დღის პური","ტარტი ან ტკბილი"], day:["დღეს","ხვალ","შაბათს"],
 msg:(a,b,n)=>`გამარჯობა! შეგიძლიათ გადამიდოთ: ${a.toLowerCase()}? გავიტან ${b.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"მიხეილ ზანდუკელის ქ. 28ა, ვერა, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"Au Blé d'or by Jean-Jacques · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for Au Blé d'or by Vitrina Studio. This is not the official website.",
 h1:"Bread from ancient Georgian red wheat", lead:"A baker from Brittany, his own fields in Arghokhi, and bread made without yeast. In Vera, on Zandukeli Street.",
 cta:"Reserve a loaf", call:"Call",
 pK:"Field to bread", pH:"How our bread is made",
 p1:"Field", p1d:"Tsiteli doli, an ancient Georgian red wheat, grown in our own fields in Arghokhi.", p2:"Mill", p2d:"Flour is milled fresh before baking.", p3:"Dough", p3d:"No yeast, spring water.", p4:"Counter", p4d:"Fresh bread and pastries in Vera.",
 sK:"On the counter", sH:"What you'll find", b1:"Bread", b1d:"Rye loaf with seeds and other breads.", b2:"Sweet", b2d:"Walnut-honey tart, cheesecake, cookies.", b3:"For home", b3d:"Ghee, honey, cheese.",
 sNote:"The selection changes daily. Message us to ask what's on today.",
 oK:"Reserve", oH:"We'll put a loaf aside", oLead:"Choose the bread and the day. A ready message opens in WhatsApp and we'll confirm there.",
 q1:"Which bread?", q2:"When will you pick it up?", q3:"Your name",
 bread:["Rye loaf with seeds","Bread of the day","Tart or something sweet"], day:["Today","Tomorrow","Saturday"],
 msg:(a,b,n)=>`Hello! Could you put aside: ${a.toLowerCase()}? I'll pick it up ${b.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"28a Mikheil Zandukeli St, Vera, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"Au Blé d'or by Jean-Jacques · demo site"},
fr:{days:["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"], closed:"Fermé", allday:"24h/24",
 demo:"Démo préparée pour Au Blé d'or par Vitrina Studio. Ce n'est pas le site officiel.",
 h1:"Le pain d'un ancien blé rouge géorgien", lead:"Un boulanger breton, ses propres champs à Arghokhi et un pain sans levure. À Vera, rue Zandukeli.",
 cta:"Réserver un pain", call:"Appeler",
 pK:"Du champ au pain", pH:"Comment naît notre pain",
 p1:"Le champ", p1d:"Tsiteli doli, un ancien blé rouge géorgien, cultivé dans nos champs à Arghokhi.", p2:"Le moulin", p2d:"La farine est moulue fraîche avant la cuisson.", p3:"La pâte", p3d:"Sans levure, à l'eau de source.", p4:"Le comptoir", p4d:"Pain frais et douceurs à Vera.",
 sK:"Au comptoir", sH:"Ce que vous trouverez", b1:"Pains", b1d:"Pain de seigle aux graines et autres pains.", b2:"Douceurs", b2d:"Tarte noix-miel, cheesecake, biscuits.", b3:"Pour la maison", b3d:"Ghee, miel, fromages.",
 sNote:"L'offre change chaque jour. Écrivez-nous pour savoir ce qu'il y a aujourd'hui.",
 oK:"Réserver", oH:"On vous met un pain de côté", oLead:"Choisissez le pain et le jour. Un message prêt s'ouvre dans WhatsApp et nous confirmerons.",
 q1:"Quel pain ?", q2:"Quand passez-vous ?", q3:"Votre nom",
 bread:["Pain de seigle aux graines","Pain du jour","Tarte ou douceur"], day:["Aujourd'hui","Demain","Samedi"],
 msg:(a,b,n)=>`Bonjour ! Pourriez-vous me mettre de côté : ${a.toLowerCase()} ? Je passe ${b.toLowerCase()}.${n?" Nom : "+n+".":""}`, send:"Envoyer sur WhatsApp",
 visitH:"Quand et où", addrK:"Adresse", addr:"28a rue Mikheil Zandukeli, Vera, Tbilissi", phoneK:"Téléphone", map:"Ouvrir la carte", foot:"Au Blé d'or by Jean-Jacques · site de démo"}};
const HOURS = [null, "9:30\u201319:30", "9:30\u201319:30", "9:30\u201319:30", "9:30\u201319:30", "9:00\u201315:00", null];
const GROUPS = ["bread", "day"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
