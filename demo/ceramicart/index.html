<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CeramicArt Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Serif+Georgian:wght@600;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: clay on the wheel — raw terracotta and slip-white, concentric throwing rings, Georgian ornament restraint. */
 --bg:#f7f1ea; --ink:#3a241a; --muted:#7a6050; --accent:#b65a36; --on-accent:#fff; --line:#eadbcb; --card:#fffaf5; --card-ink:#3a241a;
 --radius:24px; --chip-radius:999px; --btn-radius:999px;
 --display:"Cormorant Garamond","Noto Serif Georgian",serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.clay { background:#e9d6c3; position:relative; overflow:hidden; }
.rings { position:absolute; right:-90px; top:40px; width:380px; height:380px; border-radius:50%; background:repeating-radial-gradient(circle,#c98b66 0 6px,#e9d6c3 6px 22px); opacity:.55; }
.brand { font-family:"Cormorant Garamond",serif; font-weight:700; font-size:28px; text-decoration:none; color:#3a241a; }
.hero { padding:28px 0 80px; max-width:600px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px,5.2vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#5d4334; font-size:18.5px; margin:0 0 22px; }
.cls { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.cls div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; }
.cls b { display:block; font-family:var(--display); font-size:22px; margin-bottom:6px; } .cls span { color:var(--muted); font-size:15.5px; }
@media (max-width:820px){ .cls{ grid-template-columns:1fr; } .rings{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="clay"><div class="rings" aria-hidden="true"></div><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">CeramicArt</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995593335677" data-i="call"></a></div></div></div></header>
<main class="wrap"><section><p class="kick" data-i="cK"></p><h2 data-i="cH"></h2><div class="cls"><div><b data-i="c1"></b><span data-i="c1d"></span></div><div><b data-i="c2"></b><span data-i="c2d"></span></div><div><b data-i="c3"></b><span data-i="c3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="who"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><div class="addr"><div class="k" data-i="whenK"></div><div class="v" data-i="whenV"></div></div><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 593 33 56 77</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=CeramicArt+12+Tamar+Chovelidze+St+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995593335677";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია CeramicArt-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"კერამიკის სტუდია · თამარ ჭოველიძის 12", h1:"კერამიკის გაკვეთილები ქართული ტრადიციით", lead:"სტუდია, რომელიც თიხის საშუალებით ქართულ კულტურულ მემკვიდრეობას აცნობს სტუმრებს. Google-ზე 5.0.",
 cta:"გაკვეთილზე ჩაწერა", call:"დარეკვა",
 cK:"გაკვეთილები", cH:"ვისთვის", c1:"პირველად", c1d:"ბევრი სტუმარი პირველ ნამუშევარს აქ ქმნის.", c2:"ოჯახებისთვის", c2d:"6–7 წლის ბავშვებიც სიამოვნებით მონაწილეობენ.", c3:"სტუმრებისთვის", c3d:"თბილისელებიც და ქალაქის სტუმრებიც.",
 bK:"ჩაწერა", bH:"ჩაეწერე გაკვეთილზე", bLead:"აირჩიე, ვინ მოდის, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"ვინ მოდის?", q2:"რამდენი ხართ?", q3:"როდის?",
 who:["უფროსები","ბავშვებთან ერთად"], ppl:["1","2","3–5","6+"], when:["ამ კვირაში","შაბათ-კვირას","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა ჩაწერა კერამიკის გაკვეთილზე: ${a.toLowerCase()}, ${b} ადამიანი. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 whenK:"სამუშაო საათები", whenV:"დილის 11:00-დან", addr:"თამარ ჭოველიძის ქ. 12, თბილისი", foot:"CeramicArt · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for CeramicArt by Vitrina Studio. This is not the official website.",
 hK:"Ceramics studio · 12 Tamar Chovelidze St", h1:"Pottery classes rooted in Georgian tradition", lead:"A studio sharing Georgia's cultural heritage through clay. 5.0 on Google.",
 cta:"Book a class", call:"Call",
 cK:"Classes", cH:"Who it's for", c1:"First-timers", c1d:"Many guests make their very first piece here.", c2:"Families", c2d:"Kids aged 6–7 enjoy it too.", c3:"Visitors", c3d:"Locals and travellers alike.",
 bK:"Booking", bH:"Book a class", bLead:"Choose who's coming, how many and when. A ready message opens in WhatsApp.",
 q1:"Who's coming?", q2:"How many?", q3:"When?",
 who:["Adults","With kids"], ppl:["1","2","3–5","6+"], when:["This week","Weekend","Later"],
 msg:(a,b,c,n)=>`Hello! I'd like to book a pottery class: ${a.toLowerCase()}, ${b} people. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 whenK:"Opening hours", whenV:"From 11:00", addr:"12 Tamar Chovelidze St, Tbilisi", foot:"CeramicArt · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для CeramicArt от Vitrina Studio. Это не официальный сайт.",
 hK:"Керамическая студия · ул. Тамар Човелидзе, 12", h1:"Уроки керамики в грузинской традиции", lead:"Студия, которая знакомит гостей с культурным наследием Грузии через глину. 5.0 в Google.",
 cta:"Записаться", call:"Позвонить",
 cK:"Занятия", cH:"Для кого", c1:"Впервые", c1d:"Многие гости делают здесь свою первую работу.", c2:"Семьи", c2d:"Детям 6–7 лет тоже нравится.", c3:"Гости города", c3d:"И тбилисцы, и путешественники.",
 bK:"Запись", bH:"Запишитесь на урок", bLead:"Выберите, кто придёт, сколько вас и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Кто придёт?", q2:"Сколько вас?", q3:"Когда?",
 who:["Взрослые","С детьми"], ppl:["1","2","3–5","6+"], when:["На этой неделе","В выходные","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу записаться на урок керамики: ${a.toLowerCase()}, ${b} чел. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 whenK:"Часы работы", whenV:"С 11:00", addr:"ул. Тамар Човелидзе, 12, Тбилиси", foot:"CeramicArt · демо-сайт"}};
const HOURS = [null, null, null, null, null, null, null];
const GROUPS = ["who", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
