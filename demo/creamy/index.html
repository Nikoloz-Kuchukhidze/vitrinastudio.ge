<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CREAMY Tbilisi Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a cheesecake slice — cream base, biscuit-crust band, a rotating "flavour of the fortnight" sticker. */
 --bg:#fff8ef; --ink:#3a2418; --muted:#7a5d4c; --accent:#d9485f; --on-accent:#fff; --line:#f0dfcb; --card:#fffdf9; --card-ink:#3a2418;
 --radius:22px; --chip-radius:999px; --btn-radius:999px;
 --display:"Fraunces","Noto Sans Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Sans Georgian",sans-serif; }
header.cream { background:#fff1de; position:relative; overflow:hidden; border-bottom:22px solid #c98b4e; }
.brand { font-family:"Fraunces",serif; font-weight:900; font-size:30px; text-decoration:none; letter-spacing:.04em; color:var(--accent); }
.hero { padding:30px 0 70px; max-width:620px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(36px,5.6vw,62px); line-height:1.04; margin:0 0 16px; text-wrap:balance; }
.hero p { color:var(--muted); font-size:18.5px; margin:0 0 22px; }
.sticker { position:absolute; right:6%; top:110px; width:190px; height:190px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; text-align:center; padding:24px; font-weight:800; font-size:17px; line-height:1.25; transform:rotate(-8deg); box-shadow:0 10px 0 #a9344a; }
.flav { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.flav div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.flav b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .flav span { color:var(--muted); font-size:15.5px; }
.flav div:nth-child(1){ border-top:8px solid #7a9a3a; } .flav div:nth-child(2){ border-top:8px solid #c98b4e; } .flav div:nth-child(3){ border-top:8px solid var(--accent); }
@media (max-width:820px){ .flav{ grid-template-columns:1fr; } .sticker{ position:static; width:150px; height:150px; font-size:15px; margin:0 0 20px auto; } .hero{ padding-bottom:20px; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="cream"><div class="wrap" style="position:relative">
 <div class="top"><a class="brand" href="#">CREAMY</a>
  <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
 <div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#order" data-i="cta"></a><a class="ghost" href="tel:+995500054968" data-i="call"></a></div></div>
 <div class="sticker" data-i="stk"></div>
</div></header>
<main class="wrap">
 <section><p class="kick" data-i="fK"></p><h2 data-i="fH"></h2>
  <div class="flav"><div><b data-i="f1"></b><span data-i="f1d"></span></div><div><b data-i="f2"></b><span data-i="f2d"></span></div><div><b data-i="f3"></b><span data-i="f3d"></span></div></div></section>
 <section id="order"><div class="book">
  <div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
  <form class="card" onsubmit="return false">
   <fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset>
   <fieldset><legend data-i="q2"></legend><div class="chips" id="size"></div></fieldset>
   <fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset>
   <fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
   <div class="preview" id="pv" aria-live="polite"></div>
   <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
  </form></div></section>
 <section><h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 500 05 49 68</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=CREAMY+Irakli+Abashidze+14+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995500054968";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია CREAMY-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"ჩიზქეიქები · ვაკე", h1:"ჩიზქეიქი, რომლის გემოც ყოველ ორ კვირაში იცვლება", lead:"ირაკლი აბაშიძის 14-ში. მოდი ნაჭერზე ან შეუკვეთე მთლიანი ტორტი.",
 cta:"შეკვეთა", call:"დარეკვა", stk:"ახალი გემო ყოველ ორ კვირაში",
 fK:"მენიუ", fH:"რას ნახავ", f1:"ფისტა და მაყვალი", f1d:"სტუმრების ერთ-ერთი ფავორიტი.", f2:"კრემ ბრიულე", f2d:"კლასიკური ფრანგული დესერტი.", f3:"ლიმიტირებული გემო", f3d:"ყოველ ორ კვირაში ახალი.",
 bK:"შეკვეთა", bH:"შეუკვეთე წინასწარ", bLead:"აირჩიე, რა გინდა, რა ზომის და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება. მიტანით შეკვეთა Wolt-ზეც შეიძლება.",
 q1:"რა გინდა?", q2:"რამდენი?", q3:"როდის?", q4:"სახელი",
 what:["ჩიზქეიქი","ამ კვირის გემო","დიდი ტორტი"], size:["1 ნაჭერი","2–4 ნაჭერი","მთლიანი"], when:["დღეს","ხვალ","შაბათ-კვირას"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა შევუკვეთო: ${a.toLowerCase()}, ${b.toLowerCase()}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"ირაკლი აბაშიძის ქ. 14, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"CREAMY · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for CREAMY by Vitrina Studio. This is not the official website.",
 hK:"Cheesecakes · Vake", h1:"Cheesecake with a new flavour every two weeks", lead:"At 14 Irakli Abashidze St. Drop in for a slice or order a whole cake.",
 cta:"Order", call:"Call", stk:"New flavour every two weeks",
 fK:"Menu", fH:"What you'll find", f1:"Pistachio & blackberry", f1d:"A guest favourite.", f2:"Crème brûlée", f2d:"The French classic.", f3:"Limited edition", f3d:"A new one every two weeks.",
 bK:"Order", bH:"Order ahead", bLead:"Choose what, how much and when. A ready message opens in WhatsApp. Delivery is also on Wolt.",
 q1:"What would you like?", q2:"How much?", q3:"When?", q4:"Name",
 what:["Cheesecake","This week's flavour","Big cake"], size:["1 slice","2–4 slices","Whole"], when:["Today","Tomorrow","Weekend"],
 msg:(a,b,c,n)=>`Hello! I'd like to order: ${a.toLowerCase()}, ${b.toLowerCase()}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"14 Irakli Abashidze St, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"CREAMY · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для CREAMY от Vitrina Studio. Это не официальный сайт.",
 hK:"Чизкейки · Ваке", h1:"Чизкейк с новым вкусом каждые две недели", lead:"Ул. Ираклия Абашидзе, 14. Заходите за кусочком или закажите целый торт.",
 cta:"Заказать", call:"Позвонить", stk:"Новый вкус каждые две недели",
 fK:"Меню", fH:"Что у нас есть", f1:"Фисташка и ежевика", f1d:"Один из любимых вкусов гостей.", f2:"Крем-брюле", f2d:"Французская классика.", f3:"Лимитированный вкус", f3d:"Новый каждые две недели.",
 bK:"Заказ", bH:"Закажите заранее", bLead:"Выберите что, сколько и когда. В WhatsApp откроется готовое сообщение. Доставка есть и в Wolt.",
 q1:"Что хотите?", q2:"Сколько?", q3:"Когда?", q4:"Имя",
 what:["Чизкейк","Вкус недели","Большой торт"], size:["1 кусочек","2–4 кусочка","Целый"], when:["Сегодня","Завтра","На выходных"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу заказать: ${a.toLowerCase()}, ${b.toLowerCase()}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"ул. Ираклия Абашидзе, 14, Тбилиси", phoneK:"Телефон", map:"Открыть на карте", foot:"CREAMY · демо-сайт"}};
const HOURS = ["12:00\u201322:00", "12:00\u201322:00", "12:00\u201322:00", "12:00\u201322:00", "12:00\u201322:00", "12:00\u201322:00", "12:00\u201322:00"];
const GROUPS = ["what", "size", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
