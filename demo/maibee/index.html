<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MaiBee Bakery Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Serif+Georgian:wght@700;900&family=DM+Serif+Display&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: honey — warm amber, a honeycomb hex pattern, soft butter cream. */
 --bg:#fffaf0; --ink:#33240f; --muted:#7b6545; --accent:#e0a010; --on-accent:#33240f; --line:#f1e2bf; --card:#fffdf7; --card-ink:#33240f;
 --radius:16px; --chip-radius:12px; --btn-radius:12px;
 --display:"DM Serif Display","Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.hive { background:#f7c843; position:relative; overflow:hidden; }
header.hive::after { content:""; position:absolute; right:-30px; top:0; bottom:0; width:45%;
 background:radial-gradient(circle at 50% 50%, transparent 46%, rgba(255,255,255,.35) 47%, rgba(255,255,255,.35) 52%, transparent 53%) 0 0/56px 64px; -webkit-mask:linear-gradient(90deg,transparent,#000 40%); mask:linear-gradient(90deg,transparent,#000 40%); }
.brand { font-family:"DM Serif Display",serif; font-size:30px; text-decoration:none; }
.hero { padding:30px 0 80px; max-width:620px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,5.4vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { font-size:18.5px; margin:0 0 22px; color:#4f3a17; }
.hero .send { background:#33240f; color:#f7c843; }
.menu { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.menu div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
.menu b { display:block; font-family:var(--display); font-size:20px; margin-bottom:6px; } .menu span { color:var(--muted); font-size:15px; }
@media (max-width:820px){ .menu{ grid-template-columns:1fr 1fr; } header.hive::after{ width:60%; opacity:.6; } }
@media (max-width:460px){ .menu{ grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="hive"><div class="wrap">
 <div class="top"><a class="brand" href="#">MaiBee</a>
  <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
 <div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#order" data-i="cta"></a><a class="ghost" href="tel:+995591545470" data-i="call"></a></div></div>
</div></header>
<main class="wrap">
 <section><p class="kick" data-i="mK"></p><h2 data-i="mH"></h2>
  <div class="menu"><div><b data-i="m1"></b><span data-i="m1d"></span></div><div><b data-i="m2"></b><span data-i="m2d"></span></div><div><b data-i="m3"></b><span data-i="m3d"></span></div><div><b data-i="m4"></b><span data-i="m4d"></span></div></div></section>
 <section id="order"><div class="book">
  <div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
  <form class="card" onsubmit="return false">
   <fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset>
   <fieldset><legend data-i="q2"></legend><div class="chips" id="occ"></div></fieldset>
   <fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset>
   <fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
   <div class="preview" id="pv" aria-live="polite"></div>
   <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
  </form></div></section>
 <section><h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 591 54 54 70</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=MaiBee+Bakery+Nino+Zhvania+8+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995591545470";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია MaiBee-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"საცხობი და კაფე · ნინო ჟვანიას 8", h1:"ხელით გამომცხვარი ტორტები და ქაფქეიქები", lead:"ინდივიდუალური ტორტები შეკვეთით, ბრანჩი და დიეტური არჩევანიც.",
 cta:"ტორტის შეკვეთა", call:"დარეკვა",
 mK:"მენიუ", mH:"რას აცხობენ", m1:"თაფლის ტორტი", m1d:"სტუმრების ხშირი არჩევანი.", m2:"ჩიზქეიქები", m2d:"ბასკური და არაქისის-კარამელის.", m3:"ლობიანი და ხაჭაპური", m3d:"ცომეული საუზმისთვის.", m4:"ბრანჩი", m4d:"დილიდან, ყავასთან ერთად.",
 bK:"შეკვეთა", bH:"შეუკვეთე ტორტი", bLead:"აირჩიე, რა გინდა, რა შემთხვევისთვის და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გინდა?", q2:"რა შემთხვევისთვის?", q3:"როდის?", q4:"სახელი",
 what:["ტორტი","ქაფქეიქები","დიეტური ტორტი"], occ:["დაბადების დღე","სხვა დღესასწაული","უბრალოდ"], when:["ამ კვირაში","შემდეგ კვირაში","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა შევუკვეთო: ${a.toLowerCase()}. შემთხვევა: ${b.toLowerCase()}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"ნინო ჟვანიას ქ. 8, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"MaiBee · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for MaiBee by Vitrina Studio. This is not the official website.",
 hK:"Bakery & café · 8 Nino Zhvania St", h1:"Handmade cakes and cupcakes", lead:"Custom cakes to order, brunch and dietary options too.",
 cta:"Order a cake", call:"Call",
 mK:"Menu", mH:"What they bake", m1:"Honey cake", m1d:"A frequent guest pick.", m2:"Cheesecakes", m2d:"Basque and peanut-caramel.", m3:"Lobiani & khachapuri", m3d:"Savoury bakes for breakfast.", m4:"Brunch", m4d:"From the morning, with coffee.",
 bK:"Order", bH:"Order a cake", bLead:"Choose what, the occasion and when. A ready message opens in WhatsApp.",
 q1:"What would you like?", q2:"Occasion?", q3:"When?", q4:"Name",
 what:["Cake","Cupcakes","Dietary cake"], occ:["Birthday","Other celebration","Just because"], when:["This week","Next week","Later"],
 msg:(a,b,c,n)=>`Hello! I'd like to order: ${a.toLowerCase()}. Occasion: ${b.toLowerCase()}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"8 Nino Zhvania St, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"MaiBee · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для MaiBee от Vitrina Studio. Это не официальный сайт.",
 hK:"Пекарня и кафе · ул. Нино Жвания, 8", h1:"Торты и капкейки ручной работы", lead:"Индивидуальные торты на заказ, бранч и диетические варианты.",
 cta:"Заказать торт", call:"Позвонить",
 mK:"Меню", mH:"Что пекут", m1:"Медовик", m1d:"Частый выбор гостей.", m2:"Чизкейки", m2d:"Баскский и арахис-карамель.", m3:"Лобиани и хачапури", m3d:"Выпечка к завтраку.", m4:"Бранч", m4d:"С утра, к кофе.",
 bK:"Заказ", bH:"Закажите торт", bLead:"Выберите что, повод и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что хотите?", q2:"Повод?", q3:"Когда?", q4:"Имя",
 what:["Торт","Капкейки","Диетический торт"], occ:["День рождения","Другой праздник","Просто так"], when:["На этой неделе","На следующей неделе","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу заказать: ${a.toLowerCase()}. Повод: ${b.toLowerCase()}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"ул. Нино Жвания, 8, Тбилиси", phoneK:"Телефон", map:"Открыть на карте", foot:"MaiBee · демо-сайт"}};
const HOURS = ["9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00", null, "9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00"];
const GROUPS = ["what", "occ", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
