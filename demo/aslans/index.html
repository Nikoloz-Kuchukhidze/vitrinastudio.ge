<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aslan's Barbershop Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+Georgian:wdth,wght@62.5..100,400..800&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: the shop's own badge — black disc, gold ring, bearded gentleman — over a warm brick wall. Single theme by choice. */
 --bg:#141414; --ink:#f1ebe0; --muted:#b9ad9b; --accent:#e8b923; --on-accent:#141414; --line:#3a332b; --card:#1d1b19; --card-ink:#f1ebe0;
 --radius:6px; --chip-radius:4px; --btn-radius:4px;
 --display:"Oswald","Noto Sans Georgian",sans-serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:dark; }
.brick { background:
  linear-gradient(rgba(20,20,20,.72), rgba(20,20,20,.92)),
  repeating-linear-gradient(0deg, transparent 0 34px, #2a1a14 34px 37px),
  repeating-linear-gradient(90deg, #7a3b26 0 70px, #2a1a14 70px 73px) 0 0/146px 37px,
  #6b3322; }
.brick-row2 { }
.badge { width: 64px; height: 64px; border-radius: 50%; background:#111; border:3px solid var(--accent); display:grid; place-items:center; }
.badge svg { width: 40px; }
.brand { display:flex; align-items:center; gap:14px; text-decoration:none; }
.brand b { font-family:"Oswald",sans-serif; font-size:24px; letter-spacing:.06em; display:block; line-height:1; }
.brand small { color:var(--accent); font-size:12px; letter-spacing:.3em; }
.hero { padding: 40px 0 70px; display:grid; grid-template-columns:1.2fr .8fr; gap:40px; align-items:center; }
.hero h1 { font-family:"Noto Sans Georgian",sans-serif; font-variation-settings:"wdth" 68; font-weight:800; text-transform:uppercase; font-size:clamp(38px,6vw,66px); line-height:1.02; margin:0 0 18px; }
html[lang=en] .hero h1, html[lang=ru] .hero h1 { font-family:"Oswald",sans-serif; font-weight:700; }
.hero p { color:var(--muted); font-size:18.5px; max-width:30em; margin:0 0 24px; }
.status { display:inline-flex; align-items:center; gap:10px; border:1px solid var(--line); background:#0f0f0f; padding:10px 16px; border-radius:4px; font-weight:700; margin-bottom:22px; }
.dot { width:10px; height:10px; border-radius:50%; background:#5ac46b; box-shadow:0 0 0 4px rgba(90,196,107,.18); }
.dot.off { background:#c0533a; box-shadow:0 0 0 4px rgba(192,83,58,.18); }
.bigbadge { justify-self:center; width:min(320px,80%); aspect-ratio:1; border-radius:50%; background:#0e0e0e; border:8px solid var(--accent); display:grid; place-items:center; box-shadow:0 0 0 10px #0e0e0e, 0 30px 60px -20px #000; }
.bigbadge svg { width:62%; }
.tips { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.tip { border-top:3px solid var(--accent); background:var(--card); padding:20px; }
.tip b { display:block; font-family:"Oswald","Noto Sans Georgian",sans-serif; font-size:20px; margin-bottom:6px; letter-spacing:.02em; }
.tip span { color:var(--muted); font-size:15.5px; }
.svc-list { display:grid; grid-template-columns:repeat(2,1fr); gap:0 40px; }
.svc-list div { display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:14px 0; font-size:18px; }
.svc-list i { font-style:normal; color:var(--muted); font-size:14px; }
footer { background:#0c0c0c; color:var(--muted); }
@media (max-width:820px){ .hero,.tips,.svc-list{ grid-template-columns:1fr; } .bigbadge{ width:220px; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="brick">
 <div class="wrap">
  <div class="top">
   <a class="brand" href="#"><span class="badge"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="34" r="16" fill="#f1ebe0"/><path d="M28 44c0 26 10 40 22 40s22-14 22-40c-6 8-14 10-22 10s-16-2-22-10z" fill="#e8b923"/><path d="M38 52c4 3 8 4 12 4s8-1 12-4c-2 6-6 8-12 8s-10-2-12-8z" fill="#141414"/></svg></span><span><b>ASLAN'S</b><small>BARBERSHOP</small></span></a>
   <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div>
  </div>
  <div class="hero">
   <div>
    <div class="status"><span class="dot" id="dot"></span><span id="st"></span></div>
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995591212665" data-i="call"></a></div>
   </div>
   <div class="bigbadge" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="16" fill="#f1ebe0"/><path d="M28 44c0 26 10 40 22 40s22-14 22-40c-6 8-14 10-22 10s-16-2-22-10z" fill="#e8b923"/><path d="M38 52c4 3 8 4 12 4s8-1 12-4c-2 6-6 8-12 8s-10-2-12-8z" fill="#0e0e0e"/><path d="M34 24c4-8 28-8 32 0" stroke="#141414" stroke-width="5" fill="none"/></svg></div>
  </div>
 </div>
</header>
<main class="wrap">
 <section>
  <p class="kick" data-i="whyK"></p><h2 data-i="whyH"></h2>
  <div class="tips">
   <div class="tip"><b data-i="w1"></b><span data-i="w1d"></span></div>
   <div class="tip"><b data-i="w2"></b><span data-i="w2d"></span></div>
   <div class="tip"><b data-i="w3"></b><span data-i="w3d"></span></div>
  </div>
 </section>
 <section>
  <p class="kick" data-i="svcK"></p><h2 data-i="svcH"></h2>
  <div class="svc-list">
   <div><span data-i="s1"></span><i data-i="ask"></i></div><div><span data-i="s2"></span><i data-i="ask"></i></div>
   <div><span data-i="s3"></span><i data-i="ask"></i></div>
  </div>
 </section>
 <section id="book">
  <div class="book">
   <div><p class="kick" data-i="bookK"></p><h2 data-i="bookH"></h2><p class="lead" data-i="bookLead"></p></div>
   <form class="card" onsubmit="return false">
    <fieldset><legend data-i="q1"></legend><div class="chips" id="svc"></div></fieldset>
    <fieldset><legend data-i="q2"></legend><div class="chips" id="when"></div></fieldset>
    <fieldset><legend><label for="nm" data-i="q3"></label></legend><input type="text" id="nm"></fieldset>
    <div class="preview" id="pv" aria-live="polite"></div>
    <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
   </form>
  </div>
 </section>
 <section>
  <h2 data-i="visitH"></h2>
  <div class="visit">
   <table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 591 21 26 65</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Aslans+Barbershop+15+Ketevan+Tsamebuli+Ave+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div>
  </div>
 </section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995591212665";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია Aslan's Barbershop-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 openNow:"ახლა ღიაა · 00:00-მდე", opensAt:"დღეს გაიხსნება 14:00-ზე", closedMon:"ორშაბათს დაკეტილია",
 h1:"მამაკაცის შეჭრა, როგორც უნდა იყოს", lead:"ყურადღება ყველა დეტალზე, ჩქარობის გარეშე. მოდით შესაჭრელად, წახვალთ დასვენებული.",
 cta:"ჩაწერა", call:"დარეკვა",
 whyK:"რატომ ჩვენთან", whyH:"რაზეც სტუმრები ყველაზე ხშირად წერენ",
 w1:"დეტალები", w1d:"ზუსტი ნამუშევარი, ზუსტად ისე, როგორც ითხოვეთ.", w2:"ატმოსფერო", w2d:"მეგობრული გუნდი, სადაც თავს ისე გრძნობთ, როგორც სახლში.", w3:"გვიან ღიაა", w3d:"ყოველდღე შუაღამემდე, ორშაბათის გარდა.",
 svcK:"სერვისები", svcH:"რას ვაკეთებთ", s1:"თმის შეჭრა", s2:"წვერის მოვლა", s3:"თმა + წვერი", s4:"სველი პარსვა", ask:"ფასი ადგილზე",
 bookK:"ჩაწერა", bookH:"სანამ მოხვალთ, მოგვწერეთ", bookLead:"აირჩიეთ სერვისი და დრო. WhatsApp-ში მზა შეტყობინება გაიხსნება და ბარბერი დაგიდასტურებთ.",
 q1:"რა გინდათ?", q2:"როდის?", q3:"თქვენი სახელი",
 svc:["თმის შეჭრა","წვერი","თმა + წვერი"], when:["დღეს","ხვალ","ამ კვირაში"],
 msg:(s,w,n)=>`გამარჯობა! მინდა ჩავეწერო: ${s}, ${w}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"ქეთევან წამებულის გამზ. 15/17, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"Aslan's Barbershop · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for Aslan's Barbershop by Vitrina Studio. This is not the official website.",
 openNow:"Open now · until midnight", opensAt:"Opens today at 14:00", closedMon:"Closed on Mondays",
 h1:"A men's cut, done properly", lead:"Attention to every detail, never rushed. Come in for a cut, leave relaxed.",
 cta:"Book", call:"Call",
 whyK:"Why us", whyH:"What guests mention most",
 w1:"Details", w1d:"Precise work, exactly what you asked for.", w2:"Atmosphere", w2d:"A friendly team that makes you feel at home.", w3:"Open late", w3d:"Every day until midnight, except Monday.",
 svcK:"Services", svcH:"What we do", s1:"Haircut", s2:"Beard care", s3:"Hair + beard", s4:"Hot towel shave", ask:"Price in the shop",
 bookK:"Booking", bookH:"Message us before you come", bookLead:"Choose a service and a time. A ready message opens in WhatsApp and the barber confirms.",
 q1:"What do you need?", q2:"When?", q3:"Your name",
 svc:["Haircut","Beard","Hair + beard"], when:["Today","Tomorrow","This week"],
 msg:(s,w,n)=>`Hello! I'd like to book: ${s}, ${w.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"15/17 Ketevan Tsamebuli Ave, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"Aslan's Barbershop · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для Aslan's Barbershop от Vitrina Studio. Это не официальный сайт.",
 openNow:"Сейчас открыто · до полуночи", opensAt:"Сегодня откроемся в 14:00", closedMon:"По понедельникам выходной",
 h1:"Мужская стрижка, как надо", lead:"Внимание к каждой детали, без спешки. Приходите за стрижкой — уйдёте отдохнувшим.",
 cta:"Записаться", call:"Позвонить",
 whyK:"Почему мы", whyH:"О чём чаще всего пишут гости",
 w1:"Детали", w1d:"Точная работа — ровно так, как вы просили.", w2:"Атмосфера", w2d:"Дружная команда, с которой чувствуешь себя как дома.", w3:"Работаем допоздна", w3d:"Каждый день до полуночи, кроме понедельника.",
 svcK:"Услуги", svcH:"Что мы делаем", s1:"Стрижка", s2:"Борода", s3:"Стрижка + борода", s4:"Бритьё", ask:"Цена на месте",
 bookK:"Запись", bookH:"Напишите перед визитом", bookLead:"Выберите услугу и время. В WhatsApp откроется готовое сообщение, барбер подтвердит.",
 q1:"Что нужно?", q2:"Когда?", q3:"Ваше имя",
 svc:["Стрижка","Борода","Стрижка + борода"], when:["Сегодня","Завтра","На этой неделе"],
 msg:(s,w,n)=>`Здравствуйте! Хочу записаться: ${s}, ${w.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"пр. Кетеван Цамебули, 15/17, Тбилиси", phoneK:"Телефон", map:"Открыть на карте", foot:"Aslan's Barbershop · демо-сайт"}};
const HOURS = [null, "14:00\u201300:00", "14:00\u201300:00", "14:00\u201300:00", "14:00\u201300:00", "14:00\u201300:00", "14:00\u201300:00"];
const GROUPS = ["svc", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

window.extra = (t) => {
  const now = new Date(); const d = (now.getDay()+6)%7; const h = now.getHours();
  const open = d !== 0 && h >= 14;
  document.getElementById("dot").className = "dot" + (open ? "" : " off");
  document.getElementById("st").textContent = open ? t.openNow : (d === 0 ? t.closedMon : t.opensAt);
};

setLang("ka");
</script>
</body>
</html>
