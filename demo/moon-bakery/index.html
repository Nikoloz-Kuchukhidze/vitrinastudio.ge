<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moon Bakery Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@600;800&family=Noto+Sans+Georgian:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a pastel night sky — lilac, cream and a big soft moon; cute and cosy like the crockery guests mention. */
 --bg:#fbf7ff; --ink:#2e2647; --muted:#6c6488; --accent:#8b6fd6; --on-accent:#fff; --line:#e9e2f7; --card:#fff; --card-ink:#2e2647;
 --radius:30px; --chip-radius:999px; --btn-radius:999px;
 --display:"Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Quicksand",sans-serif; color-scheme:light; }
header.sky { background:linear-gradient(180deg,#2e2647 0%,#4b3d78 100%); color:#fbf7ff; position:relative; overflow:hidden; }
header.sky::before { content:""; position:absolute; right:8%; top:70px; width:220px; height:220px; border-radius:50%; background:#fff3c7; box-shadow:-38px 0 0 0 #2e2647 inset; opacity:.95; }
header.sky::after { content:""; position:absolute; inset:0; background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/46px 46px; opacity:.25; }
.brand { font-family:"Quicksand",sans-serif; font-weight:700; font-size:25px; text-decoration:none; letter-spacing:.04em; }
.hero { padding:28px 0 76px; max-width:600px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px,5vw,56px); line-height:1.08; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#d9d2f0; font-size:18.5px; margin:0 0 22px; }
.hero .send { background:#fff3c7; color:#2e2647; } .hero .ghost { color:#fbf7ff; }
.feel { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.feel div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; text-align:center; }
.feel i { font-style:normal; font-size:34px; } .feel b { display:block; font-family:var(--display); font-size:20px; margin:8px 0 4px; } .feel span { color:var(--muted); font-size:15px; }
footer { background:#2e2647; color:#d9d2f0; }
@media (max-width:820px){ .feel{ grid-template-columns:1fr; } header.sky::before{ width:130px; height:130px; right:-20px; top:90px; opacity:.5; } }
@media (max-width:560px){ header.sky::before{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="sky"><div class="wrap">
 <div class="top"><a class="brand" href="#">Moon Bakery</a>
  <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
 <div class="hero"><h1 data-i="h1"></h1><p data-i="lead"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#order" data-i="cta"></a><a class="ghost" href="tel:+995557626360" data-i="call"></a></div></div>
</div></header>
<main class="wrap">
 <section><p class="kick" data-i="fK"></p><h2 data-i="fH"></h2>
  <div class="feel"><div><i>🍪</i><b data-i="f1"></b><span data-i="f1d"></span></div><div><i>☕</i><b data-i="f2"></b><span data-i="f2d"></span></div><div><i>🌙</i><b data-i="f3"></b><span data-i="f3d"></span></div></div></section>
 <section id="order"><div class="book">
  <div><p class="kick" data-i="oK"></p><h2 data-i="oH"></h2><p class="lead" data-i="oLead"></p></div>
  <form class="card" onsubmit="return false">
   <fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset>
   <fieldset><legend data-i="q2"></legend><div class="chips" id="count"></div></fieldset>
   <fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset>
   <fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
   <div class="preview" id="pv" aria-live="polite"></div>
   <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
  </form></div></section>
 <section><h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 557 62 63 60</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Moon+Bakery+27+Paliashvili+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995557626360";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია Moon Bakery-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 h1:"საკონდიტრო და კაფე ვაკეში", lead:"მყუდრო ადგილი ფალიაშვილის ქუჩაზე. ყოველდღე 9:00-დან 22:00-მდე.",
 cta:"წინასწარ შეკვეთა", call:"დარეკვა",
 fK:"რატომ მოდიან", fH:"რას წერენ სტუმრები", f1:"ქუქი ნაყინით", f1d:"სტუმრების ერთ-ერთი საყვარელი.", f2:"სასმელები", f2d:"გემრიელი და არც თუ ძალიან ტკბილი.", f3:"ატმოსფერო", f3d:"მყუდრო სივრცე და ლამაზი ჭურჭელი.",
 oK:"გასატანად", oH:"შეუკვეთე წინასწარ", oLead:"აირჩიე, რა გინდა, რამდენი და როდის გაიტან. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გინდა?", q2:"რამდენი?", q3:"როდის გაიტან?", q4:"შენი სახელი",
 what:["ქუქი ნაყინით","სასმელი","ორივე"], count:["1","2","3+"], when:["30 წუთში","დღეს საღამოს","ხვალ"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა წინასწარ შეკვეთა: ${a.toLowerCase()}, რაოდენობა: ${b}. გავიტან: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"ზაქარია ფალიაშვილის ქ. 27, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"Moon Bakery · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for Moon Bakery by Vitrina Studio. This is not the official website.",
 h1:"Bakery & café in Vake", lead:"A cosy spot on Paliashvili Street. Daily from 9:00 to 22:00.",
 cta:"Pre-order", call:"Call",
 fK:"Why people come", fH:"What guests say", f1:"Cookie with ice cream", f1d:"One of the guests' favourites.", f2:"Drinks", f2d:"Tasty and not too sugary.", f3:"Atmosphere", f3d:"A cosy space and lovely crockery.",
 oK:"Takeaway", oH:"Order ahead", oLead:"Choose what you want, how many and when you'll pick it up. A ready message opens in WhatsApp.",
 q1:"What would you like?", q2:"How many?", q3:"Pickup time?", q4:"Your name",
 what:["Cookie with ice cream","Drink","Both"], count:["1","2","3+"], when:["In 30 minutes","This evening","Tomorrow"],
 msg:(a,b,c,n)=>`Hello! I'd like to pre-order: ${a.toLowerCase()}, quantity: ${b}. Pickup: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"27 Zakaria Paliashvili St, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"Moon Bakery · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для Moon Bakery от Vitrina Studio. Это не официальный сайт.",
 h1:"Кондитерская и кафе в Ваке", lead:"Уютное место на улице Палиашвили. Ежедневно с 9:00 до 22:00.",
 cta:"Предзаказ", call:"Позвонить",
 fK:"Почему приходят", fH:"Что пишут гости", f1:"Печенье с мороженым", f1d:"Одно из любимых у гостей.", f2:"Напитки", f2d:"Вкусные и не слишком сладкие.", f3:"Атмосфера", f3d:"Уютно и красивая посуда.",
 oK:"С собой", oH:"Закажите заранее", oLead:"Выберите, что хотите, сколько и когда заберёте. В WhatsApp откроется готовое сообщение.",
 q1:"Что хотите?", q2:"Сколько?", q3:"Когда заберёте?", q4:"Ваше имя",
 what:["Печенье с мороженым","Напиток","Оба"], count:["1","2","3+"], when:["Через 30 минут","Сегодня вечером","Завтра"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу предзаказ: ${a.toLowerCase()}, количество: ${b}. Заберу: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"ул. Закария Палиашвили, 27, Тбилиси", phoneK:"Телефон", map:"Открыть на карте", foot:"Moon Bakery · демо-сайт"}};
const HOURS = ["9:00\u201322:00", "9:00\u201322:00", "9:00\u201322:00", "9:00\u201322:00", "9:00\u201322:00", "9:00\u201322:00", "9:00\u201322:00"];
const GROUPS = ["what", "count", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
