<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bike house Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800;900&family=Archivo:wght@600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a workshop wall — chain-link border, safety yellow on graphite, a big spoked wheel. */
 --bg:#f4f4f1; --ink:#1c1d1f; --muted:#5b5e63; --accent:#f2c230; --on-accent:#1c1d1f; --line:#dedfdb; --card:#fff; --card-ink:#1c1d1f;
 --radius:8px; --chip-radius:8px; --btn-radius:8px;
 --display:"Archivo","Noto Sans Georgian",sans-serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Sans Georgian",sans-serif; }
header.shop { background:#1c1d1f; color:#f4f4f1; position:relative; overflow:hidden; border-bottom:10px solid; border-image:repeating-linear-gradient(90deg,#f2c230 0 18px,#1c1d1f 18px 24px) 10; }
.wheel { position:absolute; right:-60px; top:60px; width:320px; height:320px; border-radius:50%; border:14px solid #3a3c40;
 background:repeating-conic-gradient(from 0deg,#3a3c40 0 1.2deg,transparent 1.2deg 15deg); opacity:.8; }
.wheel::after { content:""; position:absolute; inset:42%; border-radius:50%; background:#f2c230; }
.brand { font-family:"Archivo",sans-serif; font-weight:800; font-size:26px; text-decoration:none; letter-spacing:.02em; }
.hero { padding:28px 0 80px; max-width:600px; position:relative; z-index:1; }
.hero .kick { color:#f2c230; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,5.4vw,58px); line-height:1.05; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#c6c8cc; font-size:18.5px; margin:0 0 22px; } .hero .ghost { color:#f4f4f1; }
.svc { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.svc div { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:var(--radius); padding:22px; }
.svc b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .svc span { color:var(--muted); font-size:15.5px; }
footer { background:#1c1d1f; color:#c6c8cc; }
@media (max-width:820px){ .svc{ grid-template-columns:1fr; } .wheel{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="shop"><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">BIKE HOUSE</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995555184324" data-i="call"></a></div></div></div><div class="wheel" aria-hidden="true"></div></header>
<main class="wrap"><section><p class="kick" data-i="sK"></p><h2 data-i="sH"></h2><div class="svc"><div><b data-i="s1"></b><span data-i="s1d"></span></div><div><b data-i="s2"></b><span data-i="s2d"></span></div><div><b data-i="s3"></b><span data-i="s3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="svc"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="bike"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 555 18 43 24</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Bike+house+28+Bakhtrioni+St+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995555184324";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია Bike house-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"ველო მაღაზია და სერვისი · ბახტრიონის 28", h1:"ველოსიპედის შეკეთება და მომსახურება თბილისში", lead:"Google-ზე 4.8, 400-ზე მეტი შეფასებით. ღიაა ყოველდღე 11:00-დან.",
 cta:"სერვისზე ჩაწერა", call:"დარეკვა",
 sK:"სერვისი", sH:"რისთვის მოდიან", s1:"შეკეთება", s1d:"სტუმრები ქალაქის ერთ-ერთ საუკეთესო სახელოსნოდ თვლიან.", s2:"შეფუთვა ფრენისთვის", s2d:"ველოსიპედს თვითმფრინავისთვის შეგიფუთავენ.", s3:"მაღაზია", s3d:"ველოსიპედები და აქსესუარები.",
 bK:"ჩაწერა", bH:"ჩაეწერე სერვისზე", bLead:"აირჩიე, რა გჭირდება, რა ველოსიპედი გაქვს და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გჭირდება?", q2:"ველოსიპედის ტიპი", q3:"როდის?",
 svc:["შეკეთება","შეფუთვა ფრენისთვის","ახალი ველოსიპედი"], bike:["სამთო","ქალაქის","საბავშვო"], when:["დღეს","ხვალ","ამ კვირაში"],
 msg:(a,b,c,n)=>`გამარჯობა! მჭირდება: ${a.toLowerCase()}. ველოსიპედი: ${b.toLowerCase()}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 addr:"ბახტრიონის ქ. 28, თბილისი", foot:"Bike house · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Bike house by Vitrina Studio. This is not the official website.",
 hK:"Bike shop & service · 28 Bakhtrioni St", h1:"Bike repair and servicing in Tbilisi", lead:"4.8 on Google with 400+ reviews. Open daily from 11:00.",
 cta:"Book a service", call:"Call",
 sK:"Service", sH:"What people come for", s1:"Repairs", s1d:"Guests call it one of the best workshops in town.", s2:"Packing for flights", s2d:"They'll pack your bike for the plane.", s3:"Shop", s3d:"Bikes and accessories.",
 bK:"Booking", bH:"Book a service", bLead:"Choose what you need, your bike type and when. A ready message opens in WhatsApp.",
 q1:"What do you need?", q2:"Bike type", q3:"When?",
 svc:["Repair","Packing for a flight","A new bike"], bike:["Mountain","City","Kids'"], when:["Today","Tomorrow","This week"],
 msg:(a,b,c,n)=>`Hello! I need: ${a.toLowerCase()}. Bike: ${b.toLowerCase()}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 addr:"28 Bakhtrioni St, Tbilisi", foot:"Bike house · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Bike house от Vitrina Studio. Это не официальный сайт.",
 hK:"Веломагазин и сервис · ул. Бахтриони, 28", h1:"Ремонт и обслуживание велосипедов в Тбилиси", lead:"4.8 в Google, более 400 отзывов. Открыто ежедневно с 11:00.",
 cta:"Записаться на сервис", call:"Позвонить",
 sK:"Сервис", sH:"Зачем приходят", s1:"Ремонт", s1d:"Гости называют мастерскую одной из лучших в городе.", s2:"Упаковка для перелёта", s2d:"Упакуют велосипед для самолёта.", s3:"Магазин", s3d:"Велосипеды и аксессуары.",
 bK:"Запись", bH:"Запишитесь на сервис", bLead:"Выберите, что нужно, тип велосипеда и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что нужно?", q2:"Тип велосипеда", q3:"Когда?",
 svc:["Ремонт","Упаковка для перелёта","Новый велосипед"], bike:["Горный","Городской","Детский"], when:["Сегодня","Завтра","На этой неделе"],
 msg:(a,b,c,n)=>`Здравствуйте! Нужно: ${a.toLowerCase()}. Велосипед: ${b.toLowerCase()}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 addr:"ул. Бахтриони, 28, Тбилиси", foot:"Bike house · демо-сайт"}};
const HOURS = ["11:00\u201319:00", "11:00\u201319:00", "11:00\u201319:00", "11:00\u201319:00", "11:00\u201319:00", "11:00\u201320:00", "11:00\u201320:00"];
const GROUPS = ["svc", "bike", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
