<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kaliada studio Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800;900&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: glazed cups on a shelf — playful glossy glaze colours (sage, cobalt, butter) on a warm white wall. */
 --bg:#fbf8f3; --ink:#24262b; --muted:#62656d; --accent:#3557c9; --on-accent:#fff; --line:#ebe4d9; --card:#fff; --card-ink:#24262b;
 --radius:28px; --chip-radius:999px; --btn-radius:999px;
 --display:"Unbounded","Noto Sans Georgian",sans-serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Sans Georgian",sans-serif; }
header.shelf { background:#fbf8f3; position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
.cups { position:absolute; right:5%; top:120px; display:flex; gap:14px; align-items:flex-end; }
.cups i { display:block; width:70px; border-radius:6px 6px 26px 26px; position:relative; }
.cups i::after { content:""; position:absolute; right:-18px; top:16px; width:20px; height:28px; border:7px solid currentColor; border-left:0; border-radius:0 16px 16px 0; }
.cups i:nth-child(1){ height:86px; background:#9bb79a; color:#9bb79a; } .cups i:nth-child(2){ height:104px; background:#3557c9; color:#3557c9; } .cups i:nth-child(3){ height:78px; background:#f1cf6a; color:#f1cf6a; }
.cups::after { content:""; position:absolute; left:-20px; right:-30px; bottom:-10px; height:10px; background:#c9b79f; border-radius:4px; }
.brand { font-family:"Unbounded",sans-serif; font-weight:800; font-size:22px; text-decoration:none; }
.hero { padding:28px 0 80px; max-width:580px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(32px,5vw,54px); line-height:1.08; margin:0 0 16px; text-wrap:balance; }
.hero p { color:var(--muted); font-size:18.5px; margin:0 0 22px; }
.fmt { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.fmt div { border-radius:var(--radius); padding:24px; }
.fmt div:nth-child(1){ background:#e4eee3; } .fmt div:nth-child(2){ background:#dfe6fb; } .fmt div:nth-child(3){ background:#fbf0cf; }
.fmt b { display:block; font-family:var(--display); font-size:20px; margin-bottom:6px; } .fmt span { color:var(--muted); font-size:15.5px; }
@media (max-width:820px){ .fmt{ grid-template-columns:1fr; } .cups{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="shelf"><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">Kaliada</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995598863838" data-i="call"></a></div></div>
<div class="cups" aria-hidden="true"><i></i><i></i><i></i></div></div></header>
<main class="wrap"><section><p class="kick" data-i="fK"></p><h2 data-i="fH"></h2><div class="fmt"><div><b data-i="f1"></b><span data-i="f1d"></span></div><div><b data-i="f2"></b><span data-i="f2d"></span></div><div><b data-i="f3"></b><span data-i="f3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="fmt"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 598 86 38 38</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Kaliada+studio+10+Nikoloz+Kipshidze+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995598863838";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია Kaliada studio-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"კერამიკის სტუდია · ნიკოლოზ ყიფშიძის 10", h1:"თიხის მასტერკლასები თბილ გარემოში", lead:"Google-ზე 4.8, 140-ზე მეტი შეფასებით. სამშაბათიდან კვირამდე, 12:00–21:00.",
 cta:"მასტერკლასზე ჩაწერა", call:"დარეკვა",
 fK:"ფორმატები", fH:"ვისთან ერთად მოდიან", f1:"ორნი", f1d:"წყვილის მასტერკლასი ხშირი არჩევანია.", f2:"მეგობრებთან ერთად", f2d:"დასასვენებლად და გასართობად.", f3:"ხშირი სტუმრები", f3d:"ბევრი რამდენჯერმე ბრუნდება ახალი ნამუშევრისთვის.",
 bK:"ჩაწერა", bH:"ჩაეწერე მასტერკლასზე", bLead:"აირჩიე ფორმატი, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"გამოცდილება", q2:"რამდენი ხართ?", q3:"როდის?",
 fmt:["პირველად ვცდი","უკვე მიმუშავია თიხაზე"], ppl:["1","2","3–5","6+"], when:["ამ კვირაში","შაბათ-კვირას","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა მასტერკლასზე ჩაწერა: ${a.toLowerCase()}, ${b} ადამიანი. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 addr:"ნიკოლოზ ყიფშიძის ქ. 10, თბილისი", foot:"Kaliada studio · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Kaliada studio by Vitrina Studio. This is not the official website.",
 hK:"Ceramics studio · 10 Nikoloz Kipshidze St", h1:"Pottery workshops in a warm, creative space", lead:"4.8 on Google with 140+ reviews. Tuesday to Sunday, 12:00–21:00.",
 cta:"Book a workshop", call:"Call",
 fK:"Formats", fH:"Who people come with", f1:"As a pair", f1d:"A class for two is a popular choice.", f2:"With friends", f2d:"To relax and have fun.", f3:"Regulars", f3d:"Many come back for their next piece.",
 bK:"Booking", bH:"Book a workshop", bLead:"Choose a format, how many and when. A ready message opens in WhatsApp.",
 q1:"Experience", q2:"How many?", q3:"When?",
 fmt:["First time","I've worked with clay"], ppl:["1","2","3–5","6+"], when:["This week","Weekend","Later"],
 msg:(a,b,c,n)=>`Hello! I'd like to book a workshop: ${a.toLowerCase()}, ${b} people. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 addr:"10 Nikoloz Kipshidze St, Tbilisi", foot:"Kaliada studio · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Kaliada studio от Vitrina Studio. Это не официальный сайт.",
 hK:"Керамическая студия · ул. Николоза Кипшидзе, 10", h1:"Мастер-классы по керамике в тёплой атмосфере", lead:"4.8 в Google, более 140 отзывов. Со вторника по воскресенье, 12:00–21:00.",
 cta:"Записаться", call:"Позвонить",
 fK:"Форматы", fH:"С кем приходят", f1:"Вдвоём", f1d:"Занятие на двоих — частый выбор.", f2:"С друзьями", f2d:"Отдохнуть и повеселиться.", f3:"Постоянные гости", f3d:"Многие возвращаются за новой работой.",
 bK:"Запись", bH:"Запишитесь на мастер-класс", bLead:"Выберите формат, сколько вас и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Опыт", q2:"Сколько вас?", q3:"Когда?",
 fmt:["Впервые","Уже работал(а) с глиной"], ppl:["1","2","3–5","6+"], when:["На этой неделе","В выходные","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу записаться на мастер-класс: ${a.toLowerCase()}, ${b} чел. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 addr:"ул. Николоза Кипшидзе, 10, Тбилиси", foot:"Kaliada studio · демо-сайт"}};
const HOURS = [null, "12:00\u201321:00", "12:00\u201321:00", "12:00\u201321:00", "12:00\u201321:00", "12:00\u201321:00", "12:00\u201321:00"];
const GROUPS = ["fmt", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
