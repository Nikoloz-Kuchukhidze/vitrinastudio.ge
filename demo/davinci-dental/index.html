<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DaVinci Dental Clinic Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700&family=EB+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a page from Leonardo's notebook — ivory paper, sepia ink sketch lines and proportion circles, with a calm clinical teal for actions. */
 --bg:#f6f0e3; --ink:#3a2c1e; --muted:#6f604e; --accent:#1f6f6a; --on-accent:#fff; --line:#dccfb6; --card:#fffaf0; --card-ink:#3a2c1e;
 --radius:14px; --chip-radius:999px; --btn-radius:999px;
 --display:"EB Garamond","Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.sheet { position:relative; overflow:hidden; border-bottom:1px solid var(--line);
  background: radial-gradient(circle at 82% 46%, transparent 0 139px, rgba(120,90,50,.28) 140px 141px, transparent 142px),
              linear-gradient(rgba(120,90,50,.16) 1px, transparent 1px) 0 0/100% 34px, var(--bg); }
header.sheet svg.vit { position:absolute; right:6%; top:50%; transform:translateY(-44%); width:300px; opacity:.55; }
.brand { font-family:"EB Garamond",serif; font-weight:700; font-size:25px; text-decoration:none; letter-spacing:.02em; }
.brand i { color:var(--accent); }
.hero { padding:36px 0 70px; max-width:600px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(34px,5vw,56px); line-height:1.1; margin:0 0 16px; text-wrap:balance; }
.hero p { color:var(--muted); font-size:18.5px; max-width:30em; margin:0 0 24px; }
.hero .ghost { color:var(--ink); }
.visit1 { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.visit1 div { border-top:1px solid var(--ink); padding-top:14px; }
.visit1 em { font-family:"EB Garamond",serif; font-size:30px; color:var(--accent); font-style:italic; }
.visit1 b { display:block; font-size:17.5px; margin:2px 0 4px; } .visit1 span { color:var(--muted); font-size:15.5px; }
.care { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.care div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
.care b { font-family:var(--display); font-size:19px; display:block; margin-bottom:4px; } .care span { color:var(--muted); font-size:14.5px; }
.note { color:var(--muted); font-size:14px; margin-top:10px; }
footer { background:#3a2c1e; color:#e8dcc4; }
@media (max-width:820px){ .visit1{ grid-template-columns:1fr; } .care{ grid-template-columns:1fr 1fr; } header.sheet svg.vit{ width:170px; right:-30px; opacity:.3; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="sheet">
 <svg class="vit" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="#7a5a32" stroke-width="1.1">
  <rect x="30" y="30" width="140" height="140"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="40" stroke-dasharray="3 4"/>
  <line x1="30" y1="100" x2="170" y2="100"/><line x1="100" y1="30" x2="100" y2="170"/><line x1="30" y1="30" x2="170" y2="170" stroke-dasharray="2 5"/><line x1="170" y1="30" x2="30" y2="170" stroke-dasharray="2 5"/>
  <path d="M78 82c4-10 18-12 22-3 4-9 18-7 22 3 4 12-2 22-5 34-2 9-4 22-9 22-4 0-4-14-8-14s-4 14-8 14c-5 0-7-13-9-22-3-12-9-22-5-34z" stroke="#1f6f6a" stroke-width="2"/>
 </svg>
 <div class="wrap">
  <div class="top"><a class="brand" href="#">Da<i>Vinci</i> Dental</a>
   <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
  <div class="hero"><h1 data-i="h1"></h1><p data-i="lead"></p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995595096096" data-i="call"></a></div></div>
 </div>
</header>
<main class="wrap">
 <section>
  <p class="kick" data-i="fK"></p><h2 data-i="fH"></h2>
  <div class="visit1"><div><em>i.</em><b data-i="f1"></b><span data-i="f1d"></span></div><div><em>ii.</em><b data-i="f2"></b><span data-i="f2d"></span></div><div><em>iii.</em><b data-i="f3"></b><span data-i="f3d"></span></div></div>
 </section>
 <section>
  <p class="kick" data-i="cK"></p><h2 data-i="cH"></h2>
  <div class="care"><div><b data-i="s1"></b><span data-i="s1d"></span></div><div><b data-i="s2"></b><span data-i="s2d"></span></div><div><b data-i="s3"></b><span data-i="s3d"></span></div><div><b data-i="s4"></b><span data-i="s4d"></span></div></div>
  <p class="note" data-i="cNote"></p>
 </section>
 <section id="book">
  <div class="book">
   <div><p class="kick" data-i="oK"></p><h2 data-i="oH"></h2><p class="lead" data-i="oLead"></p></div>
   <form class="card" onsubmit="return false">
    <fieldset><legend data-i="q1"></legend><div class="chips" id="need"></div></fieldset>
    <fieldset><legend data-i="q2"></legend><div class="chips" id="when"></div></fieldset>
    <fieldset><legend><label for="nm" data-i="q3"></label></legend><input type="text" id="nm"></fieldset>
    <div class="preview" id="pv" aria-live="polite"></div>
    <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
   </form>
  </div>
 </section>
 <section>
  <h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 595 09 60 96</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=DaVinci+Dental+Clinic+166+Otar+Chiladze+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div>
 </section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995595096096";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია DaVinci Dental Clinic-ისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 h1:"მშვიდი ვიზიტი სტომატოლოგთან", lead:"სტომატოლოგიური კლინიკა ოთარ ჭილაძის ქუჩაზე, სადაც ყოველ ნაბიჯს წინასწარ აგიხსნიან.",
 cta:"კონსულტაციის მოთხოვნა", call:"დარეკვა",
 fK:"პირველი ვიზიტი", fH:"როგორ მიმდინარეობს", f1:"მოგვწერეთ", f1d:"მოკლედ გვითხარით, რა გაწუხებთ, და შევარჩიოთ დრო.", f2:"გაგსინჯავთ", f2d:"ექიმი დაგათვალიერებთ და აგიხსნით, რა არის საჭირო.", f3:"ერთად გადაწყვეტთ", f3d:"გეცოდინებათ გეგმა და ფასი, სანამ მკურნალობა დაიწყება.",
 cK:"მომსახურება", cH:"რით შეგვიძლია დაგეხმაროთ", s1:"შემოწმება", s1d:"პროფილაქტიკური დათვალიერება.", s2:"წმენდა და გათეთრება", s2d:"ჯანსაღი და სუფთა ღიმილისთვის.", s3:"დაბჟენა", s3d:"კბილის აღდგენა.", s4:"ორთოდონტია", s4d:"თანკბილვის გასწორება.",
 cNote:"ზუსტ ფასს და გეგმას ექიმი გეტყვით დათვალიერების შემდეგ.",
 oK:"ჩაწერა", oH:"მოითხოვეთ კონსულტაცია", oLead:"აირჩიეთ საკითხი და სასურველი დრო. WhatsApp-ში მზა შეტყობინება გაიხსნება, კლინიკა კი ზუსტ დროს დაგიდასტურებთ.",
 q1:"რა გაინტერესებთ?", q2:"როდის გირჩევნიათ?", q3:"თქვენი სახელი",
 need:["შემოწმება","წმენდა","გათეთრება","ორთოდონტია","კბილი მტკივა"], when:["რაც შეიძლება მალე","ამ კვირაში","შაბათს"],
 msg:(a,b,n)=>`გამარჯობა! მინდა ჩაწერა: ${a.toLowerCase()}. სასურველი დრო: ${b.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"ოთარ ჭილაძის ქ. 166/10, თბილისი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"DaVinci Dental Clinic · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for DaVinci Dental Clinic by Vitrina Studio. This is not the official website.",
 h1:"A calm visit to the dentist", lead:"A dental clinic on Otar Chiladze Street, where every step is explained before it begins.",
 cta:"Request a consultation", call:"Call",
 fK:"First visit", fH:"How it works", f1:"Message us", f1d:"Tell us briefly what bothers you and pick a time.", f2:"Check-up", f2d:"The dentist examines you and explains what is needed.", f3:"Decide together", f3d:"You know the plan and the price before treatment starts.",
 cK:"Services", cH:"How we can help", s1:"Check-up", s1d:"Preventive examination.", s2:"Cleaning and whitening", s2d:"For a healthy, clean smile.", s3:"Fillings", s3d:"Tooth restoration.", s4:"Orthodontics", s4d:"Bite correction.",
 cNote:"The dentist will give you the exact plan and price after the check-up.",
 oK:"Book", oH:"Request a consultation", oLead:"Choose the topic and a preferred time. A ready message opens in WhatsApp and the clinic will confirm the exact time.",
 q1:"What are you interested in?", q2:"When suits you?", q3:"Your name",
 need:["Check-up","Cleaning","Whitening","Orthodontics","Toothache"], when:["As soon as possible","This week","Saturday"],
 msg:(a,b,n)=>`Hello! I'd like to book: ${a.toLowerCase()}. Preferred time: ${b.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"166/10 Otar Chiladze St, Tbilisi", phoneK:"Phone", map:"Open in Maps", foot:"DaVinci Dental Clinic · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для DaVinci Dental Clinic от Vitrina Studio. Это не официальный сайт.",
 h1:"Спокойный визит к стоматологу", lead:"Стоматологическая клиника на улице Отара Чиладзе, где каждый шаг объясняют заранее.",
 cta:"Записаться на консультацию", call:"Позвонить",
 fK:"Первый визит", fH:"Как это проходит", f1:"Напишите нам", f1d:"Коротко расскажите, что беспокоит, и выберите время.", f2:"Осмотр", f2d:"Врач осмотрит и объяснит, что нужно.", f3:"Решаем вместе", f3d:"Вы знаете план и цену до начала лечения.",
 cK:"Услуги", cH:"Чем мы можем помочь", s1:"Осмотр", s1d:"Профилактический осмотр.", s2:"Чистка и отбеливание", s2d:"Для здоровой и чистой улыбки.", s3:"Пломбы", s3d:"Восстановление зуба.", s4:"Ортодонтия", s4d:"Исправление прикуса.",
 cNote:"Точный план и цену врач назовёт после осмотра.",
 oK:"Запись", oH:"Запросите консультацию", oLead:"Выберите тему и удобное время. В WhatsApp откроется готовое сообщение, а клиника подтвердит точное время.",
 q1:"Что вас интересует?", q2:"Когда удобно?", q3:"Ваше имя",
 need:["Осмотр","Чистка","Отбеливание","Ортодонтия","Болит зуб"], when:["Как можно скорее","На этой неделе","В субботу"],
 msg:(a,b,n)=>`Здравствуйте! Хочу записаться: ${a.toLowerCase()}. Удобное время: ${b.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"ул. Отара Чиладзе, 166/10, Тбилиси", phoneK:"Телефон", map:"Открыть на карте", foot:"DaVinci Dental Clinic · демо-сайт"}};
const HOURS = [null, "10:00\u201318:00", "10:00\u201318:00", "10:00\u201318:00", "10:00\u201318:00", "10:00\u201316:00", null];
const GROUPS = ["need", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
