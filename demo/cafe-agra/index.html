<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Café Agra · Ushguli Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@600;800&family=Noto+Sans+Georgian:wght@400;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: Svan towers against snow — slate stone, a row of tower silhouettes, cold white and a warm hearth red. */
 --bg:#f2f3f4; --ink:#1f2630; --muted:#5b6470; --accent:#a63d2a; --on-accent:#fff; --line:#dde1e6; --card:#fff; --card-ink:#1f2630;
 --radius:6px; --chip-radius:6px; --btn-radius:6px;
 --display:"Noto Serif Georgian",serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
header.towers { background:linear-gradient(#dfe6ee,#f2f3f4); position:relative; overflow:hidden; }
.tw { position:absolute; right:3%; bottom:0; display:flex; align-items:flex-end; gap:16px; opacity:.85; }
.tw i { display:block; width:38px; background:#5b6470; clip-path:polygon(0 12%,50% 0,100% 12%,100% 100%,0 100%); }
.tw i:nth-child(1){height:190px} .tw i:nth-child(2){height:240px;background:#3e4651} .tw i:nth-child(3){height:170px} .tw i:nth-child(4){height:215px;background:#3e4651}
.brand { font-family:"Cormorant Garamond",serif; font-weight:700; font-size:26px; text-decoration:none; letter-spacing:.06em; }
.hero { padding:28px 0 80px; max-width:600px; position:relative; z-index:1; }
.hero .kick { color:var(--accent); }
.hero h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px,5.2vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:var(--muted); font-size:18.5px; margin:0 0 22px; }
.dish { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
.dish div { background:var(--card); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:var(--radius); padding:18px; }
.dish b { display:block; font-family:var(--display); font-size:19px; margin-bottom:4px; } .dish span { color:var(--muted); font-size:14.5px; }
@media (max-width:900px){ .dish{ grid-template-columns:1fr 1fr; } .tw{ display:none; } }
@media (max-width:460px){ .dish{ grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="towers"><div class="wrap"><div class="top"><a class="brand" href="#">AGRA</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995599322947" data-i="call"></a></div></div></div>
<div class="tw" aria-hidden="true"><i></i><i></i><i></i><i></i></div></header>
<main class="wrap"><section><p class="kick" data-i="dK"></p><h2 data-i="dH"></h2><div class="dish"><div><b data-i="d1"></b><span data-i="d1d"></span></div><div><b data-i="d2"></b><span data-i="d2d"></span></div><div><b data-i="d3"></b><span data-i="d3d"></span></div><div><b data-i="d4"></b><span data-i="d4d"></span></div><div><b data-i="d5"></b><span data-i="d5d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="ppl"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="meal"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><div class="addr"><div class="k" data-i="whenK"></div><div class="v" data-i="whenV"></div></div><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 599 32 29 47</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Cafe+Agra+Ushguli" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995599322947";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია კაფე აგრასთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"კაფე · უშგული, სვანეთი", h1:"ტრადიციული სვანური კერძები, თანამედროვე ხელწერით", lead:"კაფე უშგულში, სადაც რეგიონის ისტორიასა და ცოცხალ კულტურას სამზარეულოს მეშვეობით გაგიზიარებენ.",
 cta:"მაგიდის დაჯავშნა", call:"დარეკვა",
 dK:"მენიუ", dH:"რას გასინჯავთ", d1:"მერცვი", d1d:"სვანური კერძი.", d2:"ჩიშდვარი", d2d:"წასახემსებლებთან ერთად.", d3:"მაწვნის წვნიანი", d3d:"სვანური ელფერით.", d4:"კუბდარი", d4d:"სვანეთის კლასიკა.", d5:"ქერის ხაჭაპური", d5d:"ქერის ფქვილით.",
 bK:"დაჯავშნა", bH:"დაჯავშნე მაგიდა", bLead:"კაფეში მაგიდის წინასწარ დაჯავშნაა საჭირო. აირჩიე, რამდენი ხართ და როდის, და WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რამდენი ხართ?", q2:"რა დროს?", q3:"როდის?",
 ppl:["2","3–4","5–8","9+"], meal:["სადილი","ვახშამი"], when:["დღეს","ხვალ","სხვა დღეს"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა მაგიდის დაჯავშნა: ${a} ადამიანი, ${b.toLowerCase()}, ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 whenK:"დაჯავშნა", whenV:"წინასწარი დაჯავშნით", addr:"უშგული, მესტიის მუნიციპალიტეტი", foot:"კაფე აგრა · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Café Agra by Vitrina Studio. This is not the official website.",
 hK:"Café · Ushguli, Svaneti", h1:"Traditional Svan dishes with a modern twist", lead:"A café in Ushguli sharing the history and living culture of the region through its food.",
 cta:"Book a table", call:"Call",
 dK:"Menu", dH:"What to try", d1:"Mertsvi", d1d:"A Svan dish.", d2:"Chishdvari", d2d:"Served with appetizers.", d3:"Yogurt soup", d3d:"With a Svan touch.", d4:"Kubdari", d4d:"A Svaneti classic.", d5:"Barley khachapuri", d5d:"Made with barley flour.",
 bK:"Booking", bH:"Book a table", bLead:"Booking is required. Choose how many and when, and a ready message opens in WhatsApp.",
 q1:"How many?", q2:"Which meal?", q3:"When?",
 ppl:["2","3–4","5–8","9+"], meal:["Lunch","Dinner"], when:["Today","Tomorrow","Another day"],
 msg:(a,b,c,n)=>`Hello! I'd like to book a table: ${a} people, ${b.toLowerCase()}, ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 whenK:"Booking", whenV:"Booking required", addr:"Ushguli, Mestia municipality", foot:"Café Agra · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Café Agra от Vitrina Studio. Это не официальный сайт.",
 hK:"Кафе · Ушгули, Сванетия", h1:"Традиционные сванские блюда в современном прочтении", lead:"Кафе в Ушгули, где историей и живой культурой региона делятся через кухню.",
 cta:"Забронировать стол", call:"Позвонить",
 dK:"Меню", dH:"Что попробовать", d1:"Мерцви", d1d:"Сванское блюдо.", d2:"Чишдвари", d2d:"С закусками.", d3:"Суп на мацони", d3d:"По-свански.", d4:"Кубдари", d4d:"Классика Сванетии.", d5:"Ячменный хачапури", d5d:"Из ячменной муки.",
 bK:"Бронирование", bH:"Забронируйте стол", bLead:"Нужна предварительная бронь. Выберите, сколько вас и когда — в WhatsApp откроется готовое сообщение.",
 q1:"Сколько вас?", q2:"Обед или ужин?", q3:"Когда?",
 ppl:["2","3–4","5–8","9+"], meal:["Обед","Ужин"], when:["Сегодня","Завтра","В другой день"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу забронировать стол: ${a} чел., ${b.toLowerCase()}, ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 whenK:"Бронирование", whenV:"Только по брони", addr:"Ушгули, Местийский муниципалитет", foot:"Café Agra · демо-сайт"}};
const HOURS = [null, null, null, null, null, null, null];
const GROUPS = ["ppl", "meal", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
