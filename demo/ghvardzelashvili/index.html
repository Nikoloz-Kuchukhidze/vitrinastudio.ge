<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ghvardzelashvili's Marani Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700;900&family=Noto+Sans+Georgian:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: natural wine — unfiltered amber, raw clay, the Caucasus ridge on the horizon; modern, honest type. */
 --bg:#f3eee6; --ink:#1f2420; --muted:#5d6259; --accent:#b4632a; --on-accent:#fff; --line:#ddd4c4; --card:#fbf8f2; --card-ink:#1f2420;
 --radius:4px; --chip-radius:4px; --btn-radius:4px;
 --display:"Space Grotesk","Noto Serif Georgian",sans-serif; --body:"Noto Sans Georgian","Space Grotesk",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.ridge { background:#1f2420; color:#f3eee6; position:relative; overflow:hidden; }
header.ridge::after { content:""; position:absolute; left:0; right:0; bottom:0; height:90px; background:linear-gradient(160deg,transparent 30%,#3a4038 30.5%) 0 0/220px 90px repeat-x, linear-gradient(200deg,transparent 30%,#3a4038 30.5%) 110px 0/220px 90px repeat-x; opacity:.9; }
.brand { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:22px; text-decoration:none; letter-spacing:.02em; }
.hero { padding:30px 0 120px; max-width:660px; position:relative; z-index:1; }
.hero .kick { color:#e0a56b; }
.hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(34px,5.2vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#c9cbc2; font-size:18.5px; margin:0 0 22px; }
.hero .send { background:#e0a56b; color:#1f2420; } .hero .ghost { color:#f3eee6; }
.wines { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-top:2px solid var(--ink); }
.wines div { padding:18px 16px 18px 0; border-bottom:1px solid var(--line); }
.wines b { display:block; font-family:var(--display); font-size:21px; } .wines span { color:var(--muted); font-size:14.5px; }
.facts { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.facts div { background:var(--card); border:1px solid var(--line); padding:20px; border-radius:var(--radius); }
.facts b { display:block; margin-bottom:4px; } .facts span { color:var(--muted); font-size:15px; }
footer { background:#1f2420; color:#c9cbc2; }
@media (max-width:820px){ .wines{ grid-template-columns:1fr 1fr; } .facts{ grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="ridge"><div class="wrap">
 <div class="top"><a class="brand" href="#">Ghvardzelashvili's Marani</a>
  <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
 <div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#visit" data-i="cta"></a><a class="ghost" href="tel:+995599939055" data-i="call"></a></div></div>
</div></header>
<main class="wrap">
 <section><p class="kick" data-i="wK"></p><h2 data-i="wH"></h2>
  <div class="wines"><div><b data-i="w1"></b><span data-i="w1d"></span></div><div><b data-i="w2"></b><span data-i="w2d"></span></div><div><b data-i="w3"></b><span data-i="w3d"></span></div><div><b data-i="w4"></b><span data-i="w4d"></span></div></div></section>
 <section><p class="kick" data-i="fK"></p><h2 data-i="fH"></h2>
  <div class="facts"><div><b data-i="f1"></b><span data-i="f1d"></span></div><div><b data-i="f2"></b><span data-i="f2d"></span></div><div><b data-i="f3"></b><span data-i="f3d"></span></div></div></section>
 <section id="visit"><div class="book">
  <div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
  <form class="card" onsubmit="return false">
   <fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset>
   <fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset>
   <fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset>
   <fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
   <div class="preview" id="pv" aria-live="polite"></div>
   <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
  </form></div></section>
 <section><h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 599 93 90 55</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Ghvardzelashvili%27s+Marani+Kondoli" target="_blank" rel="noopener" data-i="map"></a></div></div></section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995599939055";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია ღვარძელაშვილების მარნისთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"კონდოლი · კახეთი", h1:"ბუნებრივი ქვევრის ღვინო კონდოლიდან", lead:"საოჯახო მარანი კახეთში: ორგანული ვენახი, ქვევრის ღვინო და კავკასიონის ხედი.",
 cta:"ვიზიტის დაგეგმვა", call:"დარეკვა",
 wK:"ღვინოები", wH:"რას ვაყენებთ", w1:"საფერავი", w1d:"ქვევრში დაყენებული.", w2:"კონდოლური", w2d:"ქვევრში დაყენებული.", w3:"ჟღია", w3d:"იშვიათი ჯიში.", w4:"Pet Nat", w4d:"ბუნებრივი ცქრიალა ღვინო.",
 fK:"ჩვენ შესახებ", fH:"როგორ ვმუშაობთ", f1:"ბუნებრივი ღვინო", f1d:"ქვევრი, ფილტრაციის გარეშე.", f2:"ორგანული ვენახი", f2d:"ყურძენი საკუთარი ვენახიდან.", f3:"ჭაჭა და ყველი", f3d:"ჭაჭა და შებოლილი ყველი ღვინოსთან.",
 bK:"ვიზიტი", bH:"მოდი მარანში", bLead:"აირჩიე, რა გაინტერესებს, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გაინტერესებს?", q2:"რამდენი ხართ?", q3:"როდის?", q4:"სახელი",
 what:["დეგუსტაცია","მარნისა და ვენახის ტური","ღვინის შეძენა"], ppl:["2","3–5","6+"], when:["დღეს","ამ კვირაში","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მაინტერესებს: ${a.toLowerCase()}. ვართ: ${b}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"სოფელი კონდოლი, თელავის მუნიციპალიტეტი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"ღვარძელაშვილების მარანი · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for Ghvardzelashvili's Marani by Vitrina Studio. This is not the official website.",
 hK:"Kondoli · Kakheti", h1:"Natural qvevri wine from Kondoli", lead:"A family winery in Kakheti: organic vineyards, qvevri wine and Caucasus views.",
 cta:"Plan a visit", call:"Call",
 wK:"Wines", wH:"What we make", w1:"Saperavi", w1d:"Made in qvevri.", w2:"Kondoluri", w2d:"Made in qvevri.", w3:"Zhghia", w3d:"A rare variety.", w4:"Pet Nat", w4d:"Natural sparkling wine.",
 fK:"About", fH:"How we work", f1:"Natural wine", f1d:"Qvevri, unfiltered.", f2:"Organic vineyard", f2d:"Grapes from our own vineyard.", f3:"Chacha & cheese", f3d:"Chacha and smoked cheese with the wine.",
 bK:"Visit", bH:"Come to the marani", bLead:"Choose what you'd like, group size and when. A ready message opens in WhatsApp.",
 q1:"What are you interested in?", q2:"How many?", q3:"When?", q4:"Name",
 what:["Tasting","Cellar & vineyard tour","Buying wine"], ppl:["2","3–5","6+"], when:["Today","This week","Later"],
 msg:(a,b,c,n)=>`Hello! I'm interested in: ${a.toLowerCase()}. People: ${b}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"Kondoli village, Telavi municipality", phoneK:"Phone", map:"Open in Maps", foot:"Ghvardzelashvili's Marani · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для Ghvardzelashvili's Marani от Vitrina Studio. Это не официальный сайт.",
 hK:"Кондоли · Кахетия", h1:"Натуральное вино в квеври из Кондоли", lead:"Семейная винодельня в Кахетии: органический виноградник, вино в квеври и вид на Кавказ.",
 cta:"Спланировать визит", call:"Позвонить",
 wK:"Вина", wH:"Что мы делаем", w1:"Саперави", w1d:"Выдержано в квеври.", w2:"Кондолури", w2d:"Выдержано в квеври.", w3:"Жгия", w3d:"Редкий сорт.", w4:"Pet Nat", w4d:"Натуральное игристое.",
 fK:"О нас", fH:"Как мы работаем", f1:"Натуральное вино", f1d:"Квеври, без фильтрации.", f2:"Органический виноградник", f2d:"Виноград с собственного виноградника.", f3:"Чача и сыр", f3d:"Чача и копчёный сыр к вину.",
 bK:"Визит", bH:"Приезжайте в марани", bLead:"Выберите, что интересно, сколько вас и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что интересует?", q2:"Сколько вас?", q3:"Когда?", q4:"Имя",
 what:["Дегустация","Тур по погребу и винограднику","Купить вино"], ppl:["2","3–5","6+"], when:["Сегодня","На этой неделе","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Интересует: ${a.toLowerCase()}. Нас: ${b}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"село Кондоли, Телавский муниципалитет", phoneK:"Телефон", map:"Открыть на карте", foot:"Ghvardzelashvili's Marani · демо-сайт"}};
const HOURS = ["9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00", "9:00\u201321:00"];
const GROUPS = ["what", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
