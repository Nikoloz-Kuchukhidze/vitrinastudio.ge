<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Napheri Family Winery Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700;900&family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a family table in Kartli — walnut wood, amber wine, linen; a qvevri outline as the emblem. */
 --bg:#f6efe4; --ink:#2f1f17; --muted:#6d5747; --accent:#8c2f39; --on-accent:#fff; --line:#e4d5c0; --card:#fffaf2; --card-ink:#2f1f17;
 --radius:10px; --chip-radius:8px; --btn-radius:8px;
 --display:"Cormorant Garamond","Noto Serif Georgian",serif; --body:"Noto Sans Georgian","Noto Sans",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.table { background:#2f1f17; color:#f6efe4; position:relative; overflow:hidden; }
header.table::after { content:""; position:absolute; right:-40px; bottom:-60px; width:300px; height:360px; border:3px solid #c9862f; border-radius:48% 48% 40% 40% / 30% 30% 70% 70%; opacity:.35; }
.brand { font-family:"Cormorant Garamond",serif; font-weight:700; font-size:28px; text-decoration:none; letter-spacing:.06em; }
.hero { padding:30px 0 80px; max-width:640px; position:relative; z-index:1; }
.hero .kick { color:#c9862f; }
.hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(36px,5.4vw,60px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#dccdb8; font-size:18.5px; margin:0 0 22px; }
.hero .send { background:#c9862f; color:#2f1f17; } .hero .ghost { color:#f6efe4; }
.exp { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.exp div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; border-top:4px solid var(--accent); }
.exp b { display:block; font-family:var(--display); font-size:22px; margin-bottom:6px; } .exp span { color:var(--muted); font-size:15.5px; }
.grapes { display:flex; flex-wrap:wrap; gap:10px; }
.grapes span { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font-weight:600; }
footer { background:#2f1f17; color:#dccdb8; }
@media (max-width:820px){ .exp{ grid-template-columns:1fr; } header.table::after{ width:180px; height:220px; opacity:.2; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>

<header class="table"><div class="wrap">
 <div class="top"><a class="brand" href="#">NAPHERI</a>
  <div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
 <div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995598981043" data-i="call"></a></div></div>
</div></header>
<main class="wrap">
 <section><p class="kick" data-i="eK"></p><h2 data-i="eH"></h2>
  <div class="exp"><div><b data-i="e1"></b><span data-i="e1d"></span></div><div><b data-i="e2"></b><span data-i="e2d"></span></div><div><b data-i="e3"></b><span data-i="e3d"></span></div></div></section>
 <section><p class="kick" data-i="gK"></p><h2 data-i="gH"></h2>
  <div class="grapes"><span data-i="g1"></span><span data-i="g2"></span><span data-i="g3"></span><span data-i="g4"></span><span data-i="g5"></span><span data-i="g6"></span></div></section>
 <section id="book"><div class="book">
  <div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
  <form class="card" onsubmit="return false">
   <fieldset><legend data-i="q1"></legend><div class="chips" id="fmt"></div></fieldset>
   <fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset>
   <fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset>
   <fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
   <div class="preview" id="pv" aria-live="polite"></div>
   <a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a>
  </form></div></section>
 <section><h2 data-i="visitH"></h2>
  <div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table>
   <div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 598 98 10 43</div>
   <a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Family+winery+Napheri+Navazi" target="_blank" rel="noopener" data-i="map"></a></div></div></section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const PHONE = "995598981043";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",
 demo:"დემო: მომზადებულია Napheri-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"საოჯახო მარანი · ნავაზი, მცხეთა", h1:"ქართლური ღვინო ოჯახის სუფრასთან", lead:"ღვინის დეგუსტაცია, სახლში მომზადებული ქართული კერძები და ქართული სიმღერა სუფრასთან.",
 cta:"ვიზიტის დაჯავშნა", call:"დარეკვა",
 eK:"ვიზიტი", eH:"რას გთავაზობთ", e1:"დეგუსტაცია", e1d:"ჩვენი ღვინოებისა და ჭაჭის დაგემოვნება.", e2:"ქართული სიმღერა", e2d:"სუფრასთან, როგორც ოჯახში.", e3:"საოჯახო სუფრა", e3d:"სახლში მომზადებული ქართული კერძები.",
 gK:"ჯიშები", gH:"რას ვაყენებთ", g1:"თავკვერი", g2:"ჩინებული", g3:"საფერავი", g4:"რქაწითელი", g5:"გორული მწვანე", g6:"ბუდეშური",
 bK:"დაჯავშნა", bH:"დაგეგმე ვიზიტი", bLead:"აირჩიე ფორმატი, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"ფორმატი", q2:"რამდენი ხართ?", q3:"როდის?", q4:"სახელი",
 fmt:["დეგუსტაცია","დეგუსტაცია + სადილი"], ppl:["2","3–5","6–10","10+"], when:["ამ კვირაში","შაბათს","შემდეგ კვირაში"],
 msg:(a,b,c,n)=>`გამარჯობა! გვინდა ვიზიტი: ${a.toLowerCase()}, ${b} ადამიანი, ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`, send:"გაგზავნა WhatsApp-ში",
 visitH:"როდის და სად", addrK:"მისამართი", addr:"სოფელი ნავაზი, მცხეთის მუნიციპალიტეტი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", foot:"Napheri · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",
 demo:"Demo prepared for Napheri by Vitrina Studio. This is not the official website.",
 hK:"Family winery · Navazi, Mtskheta", h1:"Kartli wine at a family table", lead:"Wine tasting, homemade Georgian food and Georgian singing at the table.",
 cta:"Book a visit", call:"Call",
 eK:"Visit", eH:"What we offer", e1:"Tasting", e1d:"Our wines and chacha.", e2:"Georgian singing", e2d:"At the table, like at home.", e3:"Family table", e3d:"Homemade Georgian dishes.",
 gK:"Varieties", gH:"What we make", g1:"Tavkveri", g2:"Chinebuli", g3:"Saperavi", g4:"Rkatsiteli", g5:"Goruli Mtsvane", g6:"Budeshuri",
 bK:"Booking", bH:"Plan your visit", bLead:"Choose the format, group size and date. A ready message opens in WhatsApp.",
 q1:"Format", q2:"How many?", q3:"When?", q4:"Name",
 fmt:["Tasting","Tasting + lunch"], ppl:["2","3–5","6–10","10+"], when:["This week","Saturday","Next week"],
 msg:(a,b,c,n)=>`Hello! We'd like to visit: ${a.toLowerCase()}, ${b} people, ${c.toLowerCase()}.${n?" Name: "+n+".":""}`, send:"Send on WhatsApp",
 visitH:"When and where", addrK:"Address", addr:"Navazi village, Mtskheta municipality", phoneK:"Phone", map:"Open in Maps", foot:"Napheri · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",
 demo:"Демо для Napheri от Vitrina Studio. Это не официальный сайт.",
 hK:"Семейная винодельня · Навази, Мцхета", h1:"Картлийское вино за семейным столом", lead:"Дегустация вина, домашняя грузинская кухня и грузинские песни за столом.",
 cta:"Забронировать визит", call:"Позвонить",
 eK:"Визит", eH:"Что мы предлагаем", e1:"Дегустация", e1d:"Наши вина и чача.", e2:"Грузинские песни", e2d:"За столом, как дома.", e3:"Семейный стол", e3d:"Домашние грузинские блюда.",
 gK:"Сорта", gH:"Что мы делаем", g1:"Тавквери", g2:"Чинебули", g3:"Саперави", g4:"Ркацители", g5:"Горули Мцване", g6:"Будешури",
 bK:"Бронирование", bH:"Спланируйте визит", bLead:"Выберите формат, количество гостей и дату. В WhatsApp откроется готовое сообщение.",
 q1:"Формат", q2:"Сколько вас?", q3:"Когда?", q4:"Имя",
 fmt:["Дегустация","Дегустация + обед"], ppl:["2","3–5","6–10","10+"], when:["На этой неделе","В субботу","На следующей неделе"],
 msg:(a,b,c,n)=>`Здравствуйте! Хотим приехать: ${a.toLowerCase()}, ${b} чел., ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`, send:"Отправить в WhatsApp",
 visitH:"Когда и где", addrK:"Адрес", addr:"село Навази, Мцхетский муниципалитет", phoneK:"Телефон", map:"Открыть на карте", foot:"Napheri · демо-сайт"}};
const HOURS = ["11:00\u201320:00", "11:00\u201320:00", "11:30\u201321:00", "10:00\u201320:00", "10:00\u201320:00", "9:00\u201320:00", null];
const GROUPS = ["fmt", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
