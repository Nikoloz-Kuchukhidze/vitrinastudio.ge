<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Georgian bakery & cafe Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Serif+Georgian:wght@700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: an Adjarian khachapuri boat — golden crust edge, yolk-yellow centre, Black Sea blue as the second colour. */
 --bg:#fdf7ec; --ink:#2a2219; --muted:#6f5f4c; --accent:#1f5f8b; --on-accent:#fff; --line:#efe2cb; --card:#fffdf8; --card-ink:#2a2219;
 --radius:18px; --chip-radius:999px; --btn-radius:999px;
 --display:"Playfair Display","Noto Serif Georgian",serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.boat { background:#1f5f8b; color:#fdf7ec; position:relative; overflow:hidden; }
.kh { position:absolute; right:4%; top:110px; width:300px; height:150px; border-radius:50%; background:#d9953f; transform:rotate(-12deg); box-shadow:inset 0 0 0 18px #b8732a; }
.kh::after { content:""; position:absolute; left:34%; top:30%; width:32%; height:40%; border-radius:50%; background:#ffd23f; box-shadow:0 0 0 12px #fff3d6; }
.brand { font-family:"Playfair Display",serif; font-weight:900; font-size:22px; text-decoration:none; }
.hero { padding:28px 0 80px; max-width:580px; position:relative; z-index:1; }
.hero .kick { color:#ffd23f; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,5.2vw,56px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#d6e6f1; font-size:18.5px; margin:0 0 22px; } .hero .send { background:#ffd23f; color:#2a2219; } .hero .ghost { color:#fdf7ec; }
.why { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.why div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.why b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .why span { color:var(--muted); font-size:15.5px; }
.boat .langs button[aria-pressed="true"]{ background:#ffd23f; color:#2a2219; border-color:#ffd23f; }
footer { background:#1f5f8b; color:#d6e6f1; }
@media (max-width:820px){ .why{ grid-template-columns:1fr; } .kh{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="boat"><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">The Georgian bakery</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995598292459" data-i="call"></a></div></div>
<div class="kh" aria-hidden="true"></div></div></header>
<main class="wrap"><section><p class="kick" data-i="wK"></p><h2 data-i="wH"></h2><div class="why"><div><b data-i="w1"></b><span data-i="w1d"></span></div><div><b data-i="w2"></b><span data-i="w2d"></span></div><div><b data-i="w3"></b><span data-i="w3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="cnt"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><div class="addr"><div class="k" data-i="whenK"></div><div class="v" data-i="whenV"></div></div><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 598 29 24 59</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=The+Georgian+bakery+cafe+36+Melikishvili+Batumi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995598292459";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია The Georgian bakery & cafe-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"ბათუმი · მელიქიშვილის 36", h1:"აჭარული ხაჭაპური ბათუმის ცენტრში", lead:"საცხობი და კაფე ჭავჭავაძისა და მელიქიშვილის კვეთაზე. Google-ზე 5.0, 120-ზე მეტი შეფასებით.",
 cta:"წინასწარ შეკვეთა", call:"დარეკვა",
 wK:"სტუმრები წერენ", wH:"რატომ მოდიან", w1:"აჭარული", w1d:"ერთ-ერთი საუკეთესო ბათუმში, ასე წერენ შეფასებებში.", w2:"დიდი პორციები", w2d:"და მისაღები ფასები.", w3:"თბილი მასპინძლები", w3d:"სუფთა გარემო და მეგობრული ხალხი.",
 bK:"შეკვეთა", bH:"შეუკვეთე წინასწარ", bLead:"აირჩიე, რა გინდა, რამდენი და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გინდა?", q2:"რამდენი?", q3:"როდის?",
 what:["აჭარული ხაჭაპური","ცომეული","ყავა წასაღებად"], cnt:["1","2–3","4+"], when:["ახლა","1 საათში","ხვალ"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა შევუკვეთო: ${a.toLowerCase()}, ${b} ცალი. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 whenK:"მისამართი", whenV:"ჭავჭავაძისა და მელიქიშვილის კვეთა", addr:"მელიქიშვილის ქ. 36, ბათუმი", foot:"The Georgian bakery & cafe · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for The Georgian bakery & cafe by Vitrina Studio. This is not the official website.",
 hK:"Batumi · 36 Melikishvili St", h1:"Adjarian khachapuri in central Batumi", lead:"A bakery and café at the corner of Chavchavadze and Melikishvili. 5.0 on Google with 120+ reviews.",
 cta:"Order ahead", call:"Call",
 wK:"Guests say", wH:"Why people come", w1:"Adjaruli", w1d:"One of the best in Batumi, according to reviews.", w2:"Big portions", w2d:"And fair prices.", w3:"Warm hosts", w3d:"A clean place and friendly people.",
 bK:"Order", bH:"Order ahead", bLead:"Choose what, how many and when. A ready message opens in WhatsApp.",
 q1:"What would you like?", q2:"How many?", q3:"When?",
 what:["Adjarian khachapuri","Pastries","Coffee to go"], cnt:["1","2–3","4+"], when:["Now","In 1 hour","Tomorrow"],
 msg:(a,b,c,n)=>`Hello! I'd like to order: ${a.toLowerCase()}, ${b} pcs. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 whenK:"Location", whenV:"Corner of Chavchavadze and Melikishvili", addr:"36 Melikishvili St, Batumi", foot:"The Georgian bakery & cafe · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для The Georgian bakery & cafe от Vitrina Studio. Это не официальный сайт.",
 hK:"Батуми · ул. Меликишвили, 36", h1:"Аджарский хачапури в центре Батуми", lead:"Пекарня и кафе на углу Чавчавадзе и Меликишвили. 5.0 в Google, более 120 отзывов.",
 cta:"Заказать заранее", call:"Позвонить",
 wK:"Гости пишут", wH:"Почему приходят", w1:"Аджарули", w1d:"Один из лучших в Батуми, судя по отзывам.", w2:"Большие порции", w2d:"И приятные цены.", w3:"Тёплые хозяева", w3d:"Чисто и дружелюбно.",
 bK:"Заказ", bH:"Закажите заранее", bLead:"Выберите что, сколько и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что хотите?", q2:"Сколько?", q3:"Когда?",
 what:["Аджарский хачапури","Выпечка","Кофе с собой"], cnt:["1","2–3","4+"], when:["Сейчас","Через час","Завтра"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу заказать: ${a.toLowerCase()}, ${b} шт. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 whenK:"Где", whenV:"Угол Чавчавадзе и Меликишвили", addr:"ул. Меликишвили, 36, Батуми", foot:"The Georgian bakery & cafe · демо-сайт"}};
const HOURS = [null, null, null, null, null, null, null];
const GROUPS = ["what", "cnt", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
