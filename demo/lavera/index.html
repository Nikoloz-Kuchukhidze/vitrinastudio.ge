<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lavera Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wdth,wght@62.5..100,500..900&family=Noto+Serif:wght@600;800&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a late-night dining room, string lights over a deep aubergine hero. Single theme by choice. */
  --hero: #241b26;
  --hero-ink: #f6efe6;
  --hero-soft: #d9cdd6;
  --page: #f6f2ef;
  --accent: #9b2335;
  --line: #cdbfc4;
  --text: #231c22;
  --soft: #62585f;
  --display: "Noto Serif Georgian", "Noto Serif", Georgia, serif;
  --body: "Noto Sans Georgian", "Noto Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #15171a; color: #eeeae2; font-size: 13.5px; text-align: center; padding: 8px 16px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
header { background: var(--hero); color: var(--hero-ink); }
.band { height: 40px; background: radial-gradient(circle at 12px 18px, #f2c14e 0 4px, rgba(242,193,78,.25) 5px 8px, transparent 9px) 0 0/48px 40px, linear-gradient(#241b26, #241b26); }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 14px var(--body); background: transparent; color: var(--hero-ink); border: 1.5px solid currentColor; opacity: .75; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--hero-ink); color: var(--hero); border-color: var(--hero-ink); }
.hero { padding: 36px 0 54px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 36px; align-items: end; }
.hero h1 { font-family: var(--display); font-variation-settings: "wdth" 80; font-weight: 900; font-size: clamp(38px, 6vw, 64px); line-height: 1.05; margin: 0 0 16px; text-wrap: balance; }
.hero p { margin: 0 0 24px; font-size: 18.5px; color: var(--hero-soft); max-width: 30em; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-block; padding: 13px 20px; border-radius: 5px; font-weight: 700; text-decoration: none; }
.btn.main { background: var(--accent); color: #fff; }
.btn.line { border: 2px solid var(--hero-ink); color: var(--hero-ink); }
.score { background: var(--page); color: var(--text); border-radius: 6px; padding: 20px; display: grid; gap: 4px; }
.score .big { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.score small { color: var(--soft); font-size: 14.5px; }
section { padding: 56px 0; }
h2 { font-family: var(--display); font-variation-settings: "wdth" 85; font-weight: 800; font-size: clamp(28px, 4vw, 38px); line-height: 1.12; margin: 0 0 22px; text-wrap: balance; }
.about { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.about p { margin: 0 0 14px; max-width: 34em; }
.menu { border-top: 2px solid var(--text); }
.dish { padding: 14px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 2px; }
.dish b { font-size: 18px; }
.dish span { color: var(--soft); font-size: 15px; }
.note { font-size: 14px; color: var(--soft); margin-top: 12px; }
.visit { background: #fff; border-radius: 6px; border: 1px solid var(--line); padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 6px 0; border-bottom: 1px solid #ececec; }
td:last-child { text-align: right; font-weight: 600; }
tr.closed td:last-child { color: var(--accent); }
tr.today td { font-weight: 700; }
.contact { display: grid; gap: 12px; align-content: start; }
.contact .k { font-size: 13.5px; color: var(--soft); font-weight: 600; letter-spacing: .04em; }
.contact .v { font-size: 18px; }
footer { background: var(--hero); color: var(--hero-soft); font-size: 14px; }
footer .wrap { padding-top: 18px; padding-bottom: 24px; }
@media (max-width: 760px) { .hero, .about, .visit { grid-template-columns: 1fr; } }
</style>
</head>

        <button id="l-en" data-l="en" aria-pressed="false">EN</button>
        <button id="l-ru" data-l="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="hero">
      <div>

        <p data-i="lead"></p>
        <div class="btns">
          <a class="btn main" href="tel:+995591008108" data-i="call"></a><a class="btn line" href="https://www.google.com/maps/search/?api=1&query=Lavera+46B+Iakob+Gogebashvili+St+Tbilisi" data-i="map"></a><a class="btn line" href="https://wolt.com/ka/geo/tbilisi/restaurant/lavera" data-i="wolt"></a>
        </div>
      </div>
      <div class="score">
        <div class="big">4.8</div>
        <small data-i="score"></small>

    </div>
  </div>
  <div class="band" aria-hidden="true"></div>
</header>
<main class="wrap">
  <section class="about">

  </section>
  <section>
    <h2 data-i="menuH"></h2>
    <div class="menu"><div class="dish"><b data-i="d0"></b><span data-i="d0s"></span></div><div class="dish"><b data-i="d1"></b><span data-i="d1s"></span></div><div class="dish"><b data-i="d2"></b><span data-i="d2s"></span></div><div class="dish"><b data-i="d3"></b><span data-i="d3s"></span></div><div class="dish"><b data-i="d4"></b><span data-i="d4s"></span></div></div>
    <p class="note" data-i="menuNote"></p>
  </section>
  <section>
    <h2 data-i="visitH"></h2>
    <div class="visit">
      <table aria-label="Hours"><tbody id="hours"></tbody></table>
      <div class="contact">
        <div><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div></div>
        <div><div class="k" data-i="phoneK"></div><div class="v">+995 591 00 81 08</div></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

const HOURS = ["24", "24", "24", "24", "24", "24", "24"];
function setLang(l) {
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { if (t[el.dataset.i] !== undefined) el.textContent = t[el.dataset.i]; });
  const today = (new Date().getDay() + 6) % 7;
  document.getElementById("hours").innerHTML = t.days.map((d, i) =>

  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
}
