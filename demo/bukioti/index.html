<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bukioti Café Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Serif+Georgian:wght@700;900&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: an owl's nook — deep forest green, warm wood, two round owl eyes as the emblem. */
 --bg:#f7f2e8; --ink:#22301f; --muted:#5e6a57; --accent:#c8742c; --on-accent:#fff; --line:#e3d9c4; --card:#fffaf1; --card-ink:#22301f;
 --radius:18px; --chip-radius:999px; --btn-radius:999px;
 --display:"Fraunces","Noto Serif Georgian",serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Serif Georgian",serif; }
header.nook { background:#22301f; color:#f7f2e8; position:relative; overflow:hidden; }
.eyes { position:absolute; right:6%; top:96px; display:flex; gap:14px; }
.eyes i { width:110px; height:110px; border-radius:50%; background:#f3c969; border:10px solid #c8742c; display:grid; place-items:center; }
.eyes i::after { content:""; width:40px; height:40px; border-radius:50%; background:#22301f; }
.brand { font-family:"Fraunces",serif; font-size:26px; text-decoration:none; }
.hero { padding:28px 0 80px; max-width:600px; position:relative; z-index:1; }
.hero .kick { color:#f3c969; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,5.2vw,56px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { color:#cfd6c6; font-size:18.5px; margin:0 0 22px; } .hero .ghost { color:#f7f2e8; }
.menu { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.menu div { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.menu b { display:block; font-family:var(--display); font-size:21px; margin-bottom:6px; } .menu span { color:var(--muted); font-size:15.5px; }
footer { background:#22301f; color:#cfd6c6; }
@media (max-width:820px){ .menu{ grid-template-columns:1fr; } .eyes{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="nook"><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">Bukioti Café</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995551676899" data-i="call"></a></div></div>
<div class="eyes" aria-hidden="true"><i></i><i></i></div></div></header>
<main class="wrap"><section><p class="kick" data-i="mK"></p><h2 data-i="mH"></h2><div class="menu"><div><b data-i="m1"></b><span data-i="m1d"></span></div><div><b data-i="m2"></b><span data-i="m2d"></span></div><div><b data-i="m3"></b><span data-i="m3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="ppl"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 551 67 68 99</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=Bukioti+Cafe+8+Gelati+St+Kutaisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995551676899";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია Bukioti Café-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"ქუთაისი · გელათის ქ. 8", h1:"ბუკიოტების კაფე ქუთაისის ცენტრში", lead:"ყავა, ტოსტები და ვაფლი ნაყინით. Google-ზე 4.9, 460-ზე მეტი შეფასებით.",
 cta:"მაგიდის დაჯავშნა", call:"დარეკვა",
 mK:"მენიუ", mH:"რას უკვეთავენ ხშირად", m1:"ლავა ქეიქი", m1d:"ნაყინით და ორი დანამატით.", m2:"ვაფლი", m2d:"ასევე ნაყინით.", m3:"ტოსტები", m3d:"მარტივი და გემრიელი.",
 bK:"დაჯავშნა", bH:"დაჯავშნე მაგიდა", bLead:"აირჩიე, რამდენი ხართ და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გინდა?", q2:"რამდენი ხართ?", q3:"როდის?",
 what:["მაგიდის დაჯავშნა","წასაღები შეკვეთა"], ppl:["1–2","3–4","5+"], when:["დღეს","ხვალ","შაბათ-კვირას"],
 msg:(a,b,c,n)=>`გამარჯობა! მინდა: ${a.toLowerCase()}. ვართ: ${b}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 addr:"გელათის ქ. 8, ქუთაისი", foot:"Bukioti Café · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for Bukioti Café by Vitrina Studio. This is not the official website.",
 hK:"Kutaisi · 8 Gelati St", h1:"An owl café in central Kutaisi", lead:"Coffee, toasties and waffles with ice cream. 4.9 on Google with 460+ reviews.",
 cta:"Book a table", call:"Call",
 mK:"Menu", mH:"Guest favourites", m1:"Lava cake", m1d:"With ice cream and two toppings.", m2:"Waffle", m2d:"Also with ice cream.", m3:"Toasties", m3d:"Simple and tasty.",
 bK:"Booking", bH:"Book a table", bLead:"Choose how many and when. A ready message opens in WhatsApp.",
 q1:"What would you like?", q2:"How many?", q3:"When?",
 what:["Book a table","Takeaway order"], ppl:["1–2","3–4","5+"], when:["Today","Tomorrow","Weekend"],
 msg:(a,b,c,n)=>`Hello! I'd like to: ${a.toLowerCase()}. People: ${b}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 addr:"8 Gelati St, Kutaisi", foot:"Bukioti Café · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для Bukioti Café от Vitrina Studio. Это не официальный сайт.",
 hK:"Кутаиси · ул. Гелати, 8", h1:"Совиное кафе в центре Кутаиси", lead:"Кофе, тосты и вафли с мороженым. 4.9 в Google, более 460 отзывов.",
 cta:"Забронировать стол", call:"Позвонить",
 mK:"Меню", mH:"Что часто заказывают", m1:"Лава-кейк", m1d:"С мороженым и двумя топпингами.", m2:"Вафля", m2d:"Тоже с мороженым.", m3:"Тосты", m3d:"Просто и вкусно.",
 bK:"Бронирование", bH:"Забронируйте стол", bLead:"Выберите, сколько вас и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что хотите?", q2:"Сколько вас?", q3:"Когда?",
 what:["Забронировать стол","Заказ с собой"], ppl:["1–2","3–4","5+"], when:["Сегодня","Завтра","На выходных"],
 msg:(a,b,c,n)=>`Здравствуйте! Хочу: ${a.toLowerCase()}. Нас: ${b}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 addr:"ул. Гелати, 8, Кутаиси", foot:"Bukioti Café · демо-сайт"}};
const HOURS = ["9:30\u201318:00", "9:00\u201318:30", "9:30\u201319:00", "9:00\u201320:30", "9:30\u201318:30", "9:00\u201319:00", "9:00\u201318:30"];
const GROUPS = ["what", "ppl", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
