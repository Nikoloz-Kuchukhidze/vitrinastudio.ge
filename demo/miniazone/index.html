<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MiniaZone Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.demo { background: #111; color: #eee; font-size: 13px; text-align: center; padding: 8px 16px; font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
.langs { display: flex; gap: 4px; }
.langs button { font: 600 13px var(--body); background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
section { padding: 60px 0; }
h2 { font-family: var(--display); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0 0 24px; text-wrap: balance; }
.kick { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.book { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
.book .lead { color: var(--muted); margin: 0; max-width: 28em; }
.card { background: var(--card); color: var(--card-ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; }
.card fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.card legend { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 9px 15px; border-radius: var(--chip-radius); border: 1px solid var(--line); font-size: 14.5px; cursor: pointer; background: transparent; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.card input[type=text] { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
.send { display: inline-flex; justify-content: center; align-items: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px 20px; border-radius: var(--btn-radius); font-weight: 700; border: 0; }
.ghost { display: inline-flex; justify-content: center; align-items: center; border: 2px solid currentColor; text-decoration: none; padding: 12px 18px; border-radius: var(--btn-radius); font-weight: 700; }
.preview { font-size: 13.5px; opacity: .8; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
tr.today td { font-weight: 700; }
tr.closed td:last-child { color: var(--muted); }
.addr .k { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.addr .v { font-size: 18px; margin-bottom: 14px; }
footer { padding: 22px 0; font-size: 14px; }
@media (max-width: 820px) { .book, .visit { grid-template-columns: 1fr; } }

:root { /* Layout idea: a play mat — big rounded blocks in primary-ish pastels, chunky friendly type. */
 --bg:#fffdf7; --ink:#26324a; --muted:#5d6782; --accent:#ff6b4a; --on-accent:#fff; --line:#ece6d6; --card:#fff; --card-ink:#26324a;
 --radius:26px; --chip-radius:16px; --btn-radius:16px;
 --display:"Baloo 2","Noto Sans Georgian",sans-serif; --body:"Noto Sans Georgian",sans-serif; color-scheme:light; }
:lang(ka) { --display:"Noto Sans Georgian",sans-serif; }
header.mat { background:#ffe9a8; position:relative; overflow:hidden; }
.blocks { position:absolute; right:4%; top:90px; display:grid; grid-template-columns:repeat(2,90px); gap:12px; transform:rotate(6deg); }
.blocks i { width:90px; height:90px; border-radius:22px; display:block; box-shadow:0 8px 0 rgba(0,0,0,.12); }
.blocks i:nth-child(1){background:#ff6b4a} .blocks i:nth-child(2){background:#4fb3a9} .blocks i:nth-child(3){background:#6c8cff} .blocks i:nth-child(4){background:#ffb03b}
.brand { font-family:"Baloo 2",sans-serif; font-weight:800; font-size:30px; text-decoration:none; color:#26324a; }
.hero { padding:28px 0 70px; max-width:600px; position:relative; z-index:1; }
.hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,5.4vw,58px); line-height:1.06; margin:0 0 16px; text-wrap:balance; }
.hero p { font-size:18.5px; margin:0 0 22px; color:#4a4f5f; }
.zones { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.zones div { border-radius:var(--radius); padding:24px; color:#fff; }
.zones div:nth-child(1){background:#4fb3a9} .zones div:nth-child(2){background:#6c8cff} .zones div:nth-child(3){background:#ff6b4a}
.zones b { display:block; font-family:var(--display); font-size:22px; margin-bottom:6px; } .zones span { font-size:15.5px; opacity:.95; }
@media (max-width:820px){ .zones{ grid-template-columns:1fr; } .blocks{ display:none; } }

</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header class="mat"><div class="wrap" style="position:relative"><div class="top"><a class="brand" href="#">MiniaZone</a><div class="langs" role="group" aria-label="Language"><button data-l="ka" aria-pressed="true">ქარ</button><button data-l="en" aria-pressed="false">EN</button><button data-l="ru" aria-pressed="false">RU</button></div></div>
<div class="hero"><p class="kick" data-i="hK"></p><h1 data-i="h1"></h1><p data-i="lead"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="send" href="#book" data-i="cta"></a><a class="ghost" href="tel:+995551770099" data-i="call"></a></div></div>
<div class="blocks" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div></header>
<main class="wrap"><section><p class="kick" data-i="zK"></p><h2 data-i="zH"></h2><div class="zones"><div><b data-i="z1"></b><span data-i="z1d"></span></div><div><b data-i="z2"></b><span data-i="z2d"></span></div><div><b data-i="z3"></b><span data-i="z3d"></span></div></div></section><section id="book"><div class="book"><div><p class="kick" data-i="bK"></p><h2 data-i="bH"></h2><p class="lead" data-i="bLead"></p></div>
<form class="card" onsubmit="return false"><fieldset><legend data-i="q1"></legend><div class="chips" id="what"></div></fieldset><fieldset><legend data-i="q2"></legend><div class="chips" id="age"></div></fieldset><fieldset><legend data-i="q3"></legend><div class="chips" id="when"></div></fieldset><fieldset><legend><label for="nm" data-i="q4"></label></legend><input type="text" id="nm"></fieldset>
<div class="preview" id="pv" aria-live="polite"></div><a class="send" id="go" href="#" target="_blank" rel="noopener" data-i="send"></a></form></div></section><section><h2 data-i="visitH"></h2><div class="visit"><table aria-label="Hours"><tbody id="hours"></tbody></table><div class="addr"><div class="k" data-i="addrK"></div><div class="v" data-i="addr"></div><div class="k" data-i="phoneK"></div><div class="v">+995 551 77 00 99</div>
<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=MiniaZone+5+Petre+Kavtaradze+Tbilisi" target="_blank" rel="noopener" data-i="map"></a></div></div></section></main><footer><div class="wrap" data-i="foot"></div></footer>
<script>
const PHONE = "995551770099";
const T = {ka:{days:["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი","კვირა"], closed:"დაკეტილია", allday:"24 საათი",visitH:"როდის და სად", addrK:"მისამართი", phoneK:"ტელეფონი", map:"რუკაზე ნახვა", send:"გაგზავნა WhatsApp-ში", q4:"სახელი",demo:"დემო: მომზადებულია MiniaZone-სთვის Vitrina Studio-ს მიერ. ეს ოფიციალური საიტი არ არის.",
 hK:"საბავშვო ცენტრი · პეტრე ქავთარაძის 5", h1:"სათამაშო სივრცე და დაბადების დღეები ბავშვებისთვის", lead:"Google-ზე 5.0, თითქმის 90 შეფასებით. ხუთშაბათიდან კვირამდე.",
 cta:"დაჯავშნა", call:"დარეკვა",
 zK:"ცენტრი", zH:"რას ნახავთ", z1:"სხვადასხვა ზონა", z1d:"სხვადასხვა ასაკის ბავშვებისთვის.", z2:"განმავითარებელი თამაში", z2d:"ასე აღწერენ მშობლები შეფასებებში.", z3:"დაბადების დღეები", z3d:"ორი-სამი წლის იუბილეებიდან დაწყებული.",
 bK:"დაჯავშნა", bH:"დაჯავშნე ვიზიტი ან დაბადების დღე", bLead:"აირჩიე, რა გინდა, ბავშვის ასაკი და როდის. WhatsApp-ში მზა შეტყობინება გაიხსნება.",
 q1:"რა გაინტერესებს?", q2:"ბავშვის ასაკი", q3:"როდის?",
 what:["ვიზიტი","დაბადების დღე"], age:["1–3 წელი","4–6 წელი","7+ წელი"], when:["ამ შაბათ-კვირას","შემდეგ კვირაში","მოგვიანებით"],
 msg:(a,b,c,n)=>`გამარჯობა! მაინტერესებს: ${a.toLowerCase()}. ბავშვის ასაკი: ${b}. დრო: ${c.toLowerCase()}.${n?" სახელი: "+n+".":""}`,
 addr:"პეტრე ქავთარაძის ქ. 5, თბილისი", foot:"MiniaZone · დემო საიტი"},
en:{days:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], closed:"Closed", allday:"Open 24 hours",visitH:"When and where", addrK:"Address", phoneK:"Phone", map:"Open in Maps", send:"Send on WhatsApp", q4:"Name",demo:"Demo prepared for MiniaZone by Vitrina Studio. This is not the official website.",
 hK:"Kids' centre · 5 Petre Kavtaradze St", h1:"A play space and birthday parties for kids", lead:"5.0 on Google with almost 90 reviews. Open Thursday to Sunday.",
 cta:"Book", call:"Call",
 zK:"Centre", zH:"What you'll find", z1:"Different zones", z1d:"For children of different ages.", z2:"Play that develops", z2d:"That's how parents describe it in reviews.", z3:"Birthday parties", z3d:"From 2nd and 3rd birthdays up.",
 bK:"Booking", bH:"Book a visit or a birthday", bLead:"Choose what you need, the child's age and when. A ready message opens in WhatsApp.",
 q1:"What are you interested in?", q2:"Child's age", q3:"When?",
 what:["A visit","A birthday party"], age:["1–3 years","4–6 years","7+ years"], when:["This weekend","Next week","Later"],
 msg:(a,b,c,n)=>`Hello! I'm interested in: ${a.toLowerCase()}. Child's age: ${b}. When: ${c.toLowerCase()}.${n?" Name: "+n+".":""}`,
 addr:"5 Petre Kavtaradze St, Tbilisi", foot:"MiniaZone · demo site"},
ru:{days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"], closed:"Выходной", allday:"Круглосуточно",visitH:"Когда и где", addrK:"Адрес", phoneK:"Телефон", map:"Открыть на карте", send:"Отправить в WhatsApp", q4:"Имя",demo:"Демо для MiniaZone от Vitrina Studio. Это не официальный сайт.",
 hK:"Детский центр · ул. Петре Кавтарадзе, 5", h1:"Игровое пространство и дни рождения для детей", lead:"5.0 в Google, почти 90 отзывов. Открыто с четверга по воскресенье.",
 cta:"Забронировать", call:"Позвонить",
 zK:"Центр", zH:"Что у нас есть", z1:"Разные зоны", z1d:"Для детей разного возраста.", z2:"Развивающая игра", z2d:"Так описывают родители в отзывах.", z3:"Дни рождения", z3d:"Начиная с 2–3 лет.",
 bK:"Бронирование", bH:"Забронируйте визит или праздник", bLead:"Выберите, что нужно, возраст ребёнка и когда. В WhatsApp откроется готовое сообщение.",
 q1:"Что интересует?", q2:"Возраст ребёнка", q3:"Когда?",
 what:["Визит","День рождения"], age:["1–3 года","4–6 лет","7+ лет"], when:["В эти выходные","На следующей неделе","Позже"],
 msg:(a,b,c,n)=>`Здравствуйте! Интересует: ${a.toLowerCase()}. Возраст ребёнка: ${b}. Когда: ${c.toLowerCase()}.${n?" Имя: "+n+".":""}`,
 addr:"ул. Петре Кавтарадзе, 5, Тбилиси", foot:"MiniaZone · демо-сайт"}};
const HOURS = [null, null, null, "14:00\u201321:00", "14:00\u201321:00", "12:00\u201321:00", "12:00\u201321:00"];
const GROUPS = ["what", "age", "when"];
let L = "ka"; const SEL = {};
function chips(id, items) {
  const box = document.getElementById(id); if (!box) return;
  if (SEL[id] === undefined) SEL[id] = 0;
  box.innerHTML = items.map((t, i) => `<label><input type="radio" name="${id}" value="${i}" ${i === SEL[id] ? "checked" : ""}><span>${t}</span></label>`).join("");
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => { SEL[id] = +inp.value; update(); }));
}
function update() {
  const t = T[L]; const go = document.getElementById("go"); if (!go) return;
  const vals = GROUPS.map(g => t[g][SEL[g] || 0]);
  const extra = document.getElementById("nm") ? document.getElementById("nm").value.trim() : "";
  const text = t.msg(...vals, extra);
  document.getElementById("pv").textContent = text;
  go.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
}
function setLang(l) {
  L = l; const t = T[l]; document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  GROUPS.forEach(g => chips(g, t[g]));
  const today = (new Date().getDay() + 6) % 7;
  const hb = document.getElementById("hours");
  if (hb) hb.innerHTML = t.days.map((d, i) => `<tr class="${HOURS[i] ? "" : "closed"} ${i === today ? "today" : ""}"><td>${d}</td><td>${HOURS[i] === "24" ? t.allday : (HOURS[i] || t.closed)}</td></tr>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  if (window.extra) window.extra(t, l);
  update();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
const nm = document.getElementById("nm"); if (nm) nm.addEventListener("input", update);

setLang("ka");
</script>
</body>
</html>
